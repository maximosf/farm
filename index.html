<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Farm Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#060710;--s1:#0b0d1c;--s2:#0f1020;--s3:#131425;
  --b1:#181a2e;--b2:#202240;--b3:#2a2d52;
  --t1:#eef0f8;--t2:#8b90b8;--t3:#464a6a;
  --fb:#1877f2;--fb2:#4299ff;--fb3:#1a56d6;
  --ig:#c13584;--ig2:#e1306c;--ig3:#f77737;
  --green:#10b981;--green2:#059669;
  --yellow:#f59e0b;--red:#ef4444;--purple:#7c3aed;--purple2:#6d28d9;
  --radius:14px;
}
body{background:var(--bg);color:var(--t1);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 70% 50% at 20% -5%,rgba(24,119,242,.05),transparent),radial-gradient(ellipse 50% 40% at 80% 100%,rgba(124,58,237,.04),transparent);pointer-events:none;z-index:0}
header{position:sticky;top:0;z-index:200;background:rgba(6,7,16,.94);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-bottom:1px solid var(--b1);height:60px;display:flex;align-items:center;padding:0 20px;gap:16px}
.logo{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:800;letter-spacing:-.3px;flex-shrink:0}
.logo-mark{width:30px;height:30px;background:linear-gradient(135deg,var(--fb),var(--purple));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 0 20px rgba(24,119,242,.35)}
.tabs{display:flex;gap:2px;background:var(--s1);border:1px solid var(--b1);border-radius:9px;padding:2px}
.tab{padding:4px 16px;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:all .2s;color:var(--t3);background:transparent;display:flex;align-items:center;gap:5px;white-space:nowrap}
.tab.active-fb{background:var(--fb);color:#fff;box-shadow:0 0 14px rgba(24,119,242,.45)}
.tab.active-ig{background:linear-gradient(135deg,var(--ig),var(--ig2));color:#fff;box-shadow:0 0 14px rgba(193,53,132,.45)}
.tab:not(.active-fb):not(.active-ig):hover{color:var(--t2);background:var(--s2)}
.hstats{display:flex;align-items:center;gap:5px;margin-left:auto;flex-wrap:nowrap}
.hstat{display:flex;flex-direction:column;align-items:center;padding:4px 12px;background:var(--s1);border:1px solid var(--b1);border-radius:8px;min-width:64px}
.hstat-v{font-size:16px;font-weight:800;line-height:1.1}
.hstat-l{font-size:8px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.7px;margin-top:1px}
.sep{width:1px;height:28px;background:var(--b1);flex-shrink:0}
.hbtn{background:linear-gradient(135deg,var(--fb),var(--purple));color:#fff;border:none;padding:6px 14px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .2s;box-shadow:0 0 14px rgba(24,119,242,.3);flex-shrink:0}
.hbtn:hover{opacity:.85}
.hbtn.ig-btn{background:linear-gradient(135deg,var(--ig),var(--ig2));box-shadow:0 0 14px rgba(193,53,132,.3)}
.lu{font-size:9px;color:var(--t3);white-space:nowrap;flex-shrink:0}
main{padding:16px 20px;max-width:1600px;margin:0 auto;position:relative;z-index:1}
.summary-bar{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
.sum-card{background:var(--s1);border:1px solid var(--b1);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.sum-label{font-size:9px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.sum-val{font-size:22px;font-weight:900;line-height:1.1}
.sum-sub{font-size:10px;color:var(--t3);margin-top:1px}
.c-fb{background:linear-gradient(135deg,var(--fb),var(--fb2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.c-ig{background:linear-gradient(135deg,var(--ig2),var(--ig3));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.c-green{color:var(--green)!important}.c-yellow{color:var(--yellow)!important}.c-purple{color:#a78bfa!important}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--radius);overflow:hidden;transition:border-color .3s;position:relative}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,transparent);transition:background .4s}
.card.running-fb{border-color:rgba(24,119,242,.35)}.card.running-fb::before{background:linear-gradient(90deg,transparent,var(--fb),transparent)}
.card.running-ig{border-color:rgba(225,48,108,.35)}.card.running-ig::before{background:linear-gradient(90deg,transparent,var(--ig2),transparent)}
.card.has-error{border-color:rgba(239,68,68,.25)}
.card-head{background:linear-gradient(180deg,var(--s2) 0%,var(--s1) 100%);border-bottom:1px solid var(--b1);padding:12px 14px}
.ch-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.phone-badge{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;flex-shrink:0}
.fb-badge{background:linear-gradient(135deg,rgba(24,119,242,.15),rgba(66,153,255,.08));border:1px solid rgba(24,119,242,.3);color:var(--fb2)}
.ig-badge{background:linear-gradient(135deg,rgba(193,53,132,.15),rgba(225,48,108,.08));border:1px solid rgba(193,53,132,.3);color:var(--ig2)}
.phone-info{margin-left:9px;flex:1;min-width:0}
.phone-title{font-size:13px;font-weight:700}
.phone-ip{font-size:9px;color:var(--t3);font-family:monospace;margin-top:1px}
.pill{display:flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap;flex-shrink:0}
.pill-run-fb{background:rgba(24,119,242,.12);color:var(--fb2);border:1px solid rgba(24,119,242,.25)}
.pill-run-ig{background:rgba(225,48,108,.12);color:var(--ig2);border:1px solid rgba(225,48,108,.25)}
.pill-idle{background:rgba(70,74,106,.1);color:var(--t3);border:1px solid var(--b1)}
.pill-err{background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(239,68,68,.25)}
.dot{width:5px;height:5px;border-radius:50%;animation:pulse 1.6s infinite}
.dot-fb{background:var(--fb2)}.dot-ig{background:var(--ig2)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.65)}}
.prog-row{display:flex;justify-content:space-between;margin-bottom:4px}
.prog-label{font-size:9px;color:var(--t3);font-weight:500}
.prog-pct{font-size:9px;font-weight:700;color:var(--t2)}
.prog-bar{height:2px;background:var(--b1);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px;transition:width .9s ease}
.fill-fb{background:linear-gradient(90deg,var(--fb),var(--fb2))}
.fill-ig{background:linear-gradient(90deg,var(--ig),var(--ig2),var(--ig3))}
.mini-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:10px}
.ms{background:var(--bg);border:1px solid var(--b1);border-radius:7px;padding:6px 3px;text-align:center}
.ms-v{font-size:15px;font-weight:800;line-height:1}
.ms-l{font-size:7px;color:var(--t3);text-transform:uppercase;letter-spacing:.7px;margin-top:2px;font-weight:600}
.acc-list{max-height:240px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--b2) transparent}
.acc-list::-webkit-scrollbar{width:3px}
.acc-list::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}
.acc-head{padding:9px 14px 5px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--b1)}
.acc-head-title{font-size:8px;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.8px}
.acc-head-count{font-size:8px;color:var(--t3);font-weight:600}
.acc-row{padding:5px 14px;display:flex;align-items:center;gap:7px;cursor:pointer;transition:background .12s;border-bottom:1px solid transparent}
.acc-row:hover{background:var(--s2)}
.acc-row.acc-active{background:rgba(24,119,242,.05)}
.acc-row.acc-active-ig{background:rgba(193,53,132,.05)}
.acc-num{width:20px;font-size:9px;color:var(--t3);font-weight:600;flex-shrink:0;text-align:right}
.acc-name{flex:1;font-size:10px;color:var(--t2);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-row.acc-active .acc-name,.acc-row.acc-active-ig .acc-name{color:var(--t1);font-weight:600}
.acc-flw{font-size:10px;font-weight:700;color:var(--fb2);min-width:36px;text-align:right;flex-shrink:0}
.acc-flw.ig{color:var(--ig2)}
.acc-delta{font-size:9px;font-weight:700;min-width:32px;text-align:right;flex-shrink:0}
.pos{color:var(--green)}.neg{color:var(--red)}.zero{color:var(--t3)}
.acc-badge span{font-size:7px;padding:1px 5px;border-radius:20px;font-weight:700;text-transform:uppercase}
.b-verify{background:rgba(245,158,11,.12);color:#fbbf24;border:1px solid rgba(245,158,11,.3)}
.b-logout{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.3)}
.b-ban{background:rgba(100,116,139,.12);color:#94a3b8;border:1px solid rgba(100,116,139,.3)}
.acc-arr{font-size:9px;color:var(--t3);transition:transform .2s;flex-shrink:0}
.acc-row.expanded .acc-arr{transform:rotate(180deg)}
.acc-detail{display:none;background:var(--bg);border-bottom:1px solid var(--b1);padding:10px 14px 12px 40px}
.acc-detail.open{display:block}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.dg-item{background:var(--s1);border:1px solid var(--b1);border-radius:7px;padding:8px 11px}
.dg-label{font-size:8px;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px}
.dg-val{font-size:13px;font-weight:700;color:var(--t1)}
.dg-val.big{font-size:17px}
.dg-val.c-green{color:var(--green)}.dg-val.c-red{color:var(--red)}.dg-val.muted{color:var(--t3);font-size:11px}
.dg-sub{font-size:9px;color:var(--t3);margin-top:2px}
.detail-link{font-size:10px;color:var(--fb2);text-decoration:none;font-weight:600}
.detail-link.ig{color:var(--ig2)}
.detail-link:hover{text-decoration:underline}
.flw-hist{margin-top:5px}
.fhr{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid var(--b1);font-size:10px}
.fhr:last-child{border-bottom:none}
.fhr-date{color:var(--t3);font-size:9px;min-width:45px}
.fhr-val{font-weight:700;color:var(--t1);min-width:50px;text-align:center}
.fhr-chg{font-weight:700;min-width:40px;text-align:right}
.crane-btn{font-size:9px;padding:3px 9px;background:rgba(124,58,237,.1);border:1px solid rgba(124,58,237,.25);color:#a78bfa;border-radius:6px;cursor:pointer;font-family:inherit;font-weight:700}
.crane-btn:hover{background:rgba(124,58,237,.2)}
.crane-panel{display:none;border-top:1px solid var(--b1)}
.crane-panel.open{display:block}
.ctr-row{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:7px;background:var(--s1);border:1px solid var(--b1)}
.ctr-row.ctr-active{border-color:rgba(16,185,129,.35);background:rgba(16,185,129,.04)}
.ctr-row.ctr-fresh{border-color:rgba(124,58,237,.35);background:rgba(124,58,237,.04)}
.ctr-name{font-size:10px;font-weight:600;color:var(--t2);font-family:monospace;flex:1}
.ctr-cb{width:13px;height:13px;cursor:pointer;accent-color:var(--purple)}
.ctr-badge{font-size:7px;padding:1px 5px;border-radius:20px;font-weight:700;text-transform:uppercase}
.ctr-active-b{background:rgba(16,185,129,.12);color:#34d399;border:1px solid rgba(16,185,129,.25)}
.ctr-fresh-b{background:rgba(124,58,237,.12);color:#a78bfa;border:1px solid rgba(124,58,237,.25)}
.cbtn{padding:2px 7px;font-size:9px;border-radius:5px;border:none;cursor:pointer;font-family:inherit;font-weight:700}
.cbtn-sw{background:rgba(59,130,246,.12);color:#60a5fa;border:1px solid rgba(59,130,246,.25)}
.cbtn-wi{background:rgba(245,158,11,.12);color:#fbbf24;border:1px solid rgba(245,158,11,.25)}
.cbtn-de{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.25)}
.crane-log-item{font-size:9px;color:var(--t3);font-family:monospace;padding:1px 0}
.crane-log-item.done{color:#34d399}.crane-log-item.error{color:#f87171}.crane-log-item.pending{color:#fbbf24}
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:999;align-items:center;justify-content:center}
.modal-ov.open{display:flex}
.modal{background:var(--s1);border:1px solid var(--b2);border-radius:14px;padding:22px;width:300px}
.modal-title{font-size:13px;font-weight:700;margin-bottom:12px}
.modal input{width:100%;background:var(--bg);border:1px solid var(--b2);border-radius:7px;padding:8px 11px;color:var(--t1);font-family:inherit;font-size:12px;margin-bottom:12px;outline:none}
.modal input:focus{border-color:var(--purple)}
.modal-btns{display:flex;gap:7px}
.modal-btns button{flex:1;padding:7px;font-size:11px;font-weight:700;border:none;border-radius:7px;cursor:pointer;font-family:inherit}
.btn-ok{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff}
.btn-cancel{background:var(--s2);color:var(--t2);border:1px solid var(--b2)}
.btn-sm{padding:4px 10px;font-size:10px;border-radius:7px;border:none;cursor:pointer;font-family:inherit;font-weight:700;color:#fff;transition:opacity .2s}
.btn-sm:hover{opacity:.85}
.btn-blue{background:linear-gradient(135deg,#1d4ed8,var(--fb))}.btn-green{background:linear-gradient(135deg,var(--green2),var(--green))}.btn-red{background:linear-gradient(135deg,#b91c1c,var(--red))}.btn-purple{background:linear-gradient(135deg,var(--purple2),var(--purple))}.btn-ghost{background:var(--s2);color:var(--t2);border:1px solid var(--b2)}
.empty{padding:14px;font-size:10px;color:var(--t3);text-align:center}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--b2);border-radius:4px}
</style>
</head>
<body>
<header>
  <div class="logo"><div class="logo-mark">⬡</div>Farm</div>
  <div class="tabs">
    <button class="tab active-fb" id="tab-fb" onclick="switchPlatform('fb')">🟦 Facebook</button>
    <button class="tab" id="tab-ig" onclick="switchPlatform('ig')">📸 Instagram</button>
  </div>
  <div class="hstats">
    <div class="hstat"><div class="hstat-v" id="h-accounts">—</div><div class="hstat-l">Accounts</div></div>
    <div class="sep"></div>
    <div class="hstat"><div class="hstat-v" id="h-active">—</div><div class="hstat-l">Active</div></div>
    <div class="sep"></div>
    <div class="hstat"><div class="hstat-v" id="h-reels">—</div><div class="hstat-l">Reels</div></div>
    <div class="sep"></div>
    <div class="hstat"><div class="hstat-v" id="h-followers" style="color:var(--fb2)">—</div><div class="hstat-l">Followers</div></div>
    <div class="sep"></div>
    <div class="hstat"><div class="hstat-v" id="h-delta" style="color:var(--green)">—</div><div class="hstat-l">+24h</div></div>
    <div class="sep"></div>
    <span class="lu" id="h-lu">—</span>
    <div class="sep"></div>
    <button class="hbtn" id="refresh-btn" onclick="load()">↻ Refresh</button>
  </div>
</header>
<main>
  <div class="summary-bar">
    <div class="sum-card"><div class="sum-label">Total Accounts</div><div class="sum-val c-fb" id="s-accounts">—</div><div class="sum-sub">across all phones</div></div>
    <div class="sum-card"><div class="sum-label">Phones Running</div><div class="sum-val c-purple" id="s-active">—</div><div class="sum-sub" id="s-active-sub">of 8 phones</div></div>
    <div class="sum-card"><div class="sum-label">Reels Today</div><div class="sum-val c-fb" id="s-reels">—</div><div class="sum-sub">posted this session</div></div>
    <div class="sum-card"><div class="sum-label">Total Followers</div><div class="sum-val c-green" id="s-followers">—</div><div class="sum-sub" id="s-followers-sub">across all accounts</div></div>
    <div class="sum-card"><div class="sum-label">Gained Today</div><div class="sum-val c-green" id="s-delta">—</div><div class="sum-sub">follower growth 24h</div></div>
    <div class="sum-card"><div class="sum-label">Issues</div><div class="sum-val" id="s-issues">—</div><div class="sum-sub" id="s-issues-sub">verify / logged out</div></div>
  </div>
  <div class="grid" id="grid"></div>
</main>
<div class="modal-ov" id="modal-create">
  <div class="modal">
    <div class="modal-title">➕ Create Container</div>
    <input id="modal-name" placeholder="Name (e.g. 21)"/>
    <div class="modal-btns">
      <button class="btn-ok" onclick="modalConfirmCreate()">Create</button>
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>
<script>
const API='https://farm-production-8282.up.railway.app';
const PHONES={1:{ip:'192.168.1.9'},2:{ip:'192.168.1.12'},3:{ip:'192.168.1.14'},4:{ip:'192.168.1.10'},5:{ip:'192.168.1.11'},6:{ip:'192.168.1.15'},7:{ip:'192.168.1.13'},8:{ip:'192.168.1.5'}};
const BIO_LINKS={1:'oopsie.bio/madgph1',2:'oopsie.bio/maddy2',3:'oopsie.bio/maddgirl3',4:'oopsie.bio/maddbab4',5:'oopsie.bio/maddiecute5',6:'oopsie.bio/madpookie6',7:'oopsie.bio/maddmadd7',8:'oopsie.bio/madd8',9:'oopsie.bio/ismaddie9',10:'oopsie.bio/maddiegirll10'};
let platform='fb';
const expanded={},craneOpen={},craneCtrs={},craneLogs={},craneState={},craneSelected={};
let modalPhone=null;

function fmt(n){
  if(n===null||n===undefined||n===''||n==='?'||n==='—')return'—';
  const s=String(n).trim().replace(/,/g,''),su=s.toUpperCase();
  let v;
  if(su.endsWith('K'))v=parseFloat(su)*1000;
  else if(su.endsWith('M'))v=parseFloat(su)*1000000;
  else v=parseFloat(s);
  if(isNaN(v))return'—';
  if(v>=1000000)return(v/1000000).toFixed(1)+'M';
  if(v>=10000)return Math.round(v/1000)+'K';
  if(v>=1000)return(v/1000).toFixed(1)+'K';
  return Math.round(v).toLocaleString();
}
function fmtFull(n){const v=parseFollowers(n);return v>0?v.toLocaleString():'—';}
function fmtDelta(d){
  if(d===null||d===undefined)return{text:'—',cls:'zero'};
  const v=Number(d);if(isNaN(v))return{text:'—',cls:'zero'};
  if(v>0)return{text:'+'+fmt(v),cls:'pos'};
  if(v<0)return{text:fmt(v),cls:'neg'};
  return{text:'→0',cls:'zero'};
}
function fmtDate(ts){
  if(!ts)return'—';
  const d=new Date(ts*1000),now=new Date(),diff=Math.floor((now-d)/86400000);
  if(diff===0)return'Today';if(diff===1)return'Yesterday';
  if(diff<30)return diff+'d ago';
  return d.toLocaleDateString('en',{month:'short',day:'numeric'});
}
function fmtDateFull(ts){if(!ts)return'';return new Date(ts*1000).toLocaleDateString('en',{month:'short',day:'numeric',year:'numeric'});}
function fmtTime(str){if(!str)return'—';return str.slice(11,16);}
function parseFollowers(raw){
  if(!raw||raw==='?'||raw==='—')return 0;
  const su=String(raw).trim().replace(/,/g,'').toUpperCase();
  if(su.endsWith('K'))return parseFloat(su)*1000;
  if(su.endsWith('M'))return parseFloat(su)*1000000;
  return parseFloat(su)||0;
}

function switchPlatform(p){
  platform=p;
  document.getElementById('tab-fb').className='tab'+(p==='fb'?' active-fb':'');
  document.getElementById('tab-ig').className='tab'+(p==='ig'?' active-ig':'');
  document.getElementById('refresh-btn').className='hbtn'+(p==='ig'?' ig-btn':'');
  document.getElementById('h-followers').style.color=p==='fb'?'var(--fb2)':'var(--ig2)';
  buildCards();load();
}

const _ctrCache={};
function buildCards(){
  const g=document.getElementById('grid');g.innerHTML='';
  const p=platform,ac=p==='fb'?'c-fb':'c-ig',fill=p==='fb'?'fill-fb':'fill-ig';
  const badge=p==='fb'?'fb-badge':'ig-badge',flwCls=p==='fb'?'acc-flw':'acc-flw ig',linkCls=p==='fb'?'detail-link':'detail-link ig';

    const a=c.name;
    return`
    <div class="acc-row" id="ar-${p}-${n}-${a}" onclick="toggleDetail(${n},'${a}')">
      <span class="acc-num">${a}</span>
      <span class="acc-name" id="an-${p}-${n}-${a}">Container ${a}</span>
      <span class="acc-badge" id="badge-${p}-${n}-${a}"></span>
      <span class="${flwCls}" id="flw-${p}-${n}-${a}">—</span>
      <span class="acc-delta zero" id="delta-${p}-${n}-${a}">—</span>
      <span class="acc-arr">▾</span>
    </div>
    <div class="acc-detail" id="det-${p}-${n}-${a}">
      <div class="dg">
        <div class="dg-item"><div class="dg-label">Followers</div><div class="dg-val big ${ac}" id="dflw-${p}-${n}-${a}">—</div><div class="dg-sub" id="dflw-sub-${p}-${n}-${a}"></div></div>
        <div class="dg-item"><div class="dg-label">+24h Change</div><div class="dg-val" id="ddelta-${p}-${n}-${a}">—</div><div class="dg-sub" id="ddelta-sub-${p}-${n}-${a}"></div></div>
        <div class="dg-item"><div class="dg-label">Views</div><div class="dg-val muted" id="dviews-${p}-${n}-${a}">—</div><div class="dg-sub">Total reel views</div></div>
        <div class="dg-item"><div class="dg-label">Views +24h</div><div class="dg-val" id="dviews-delta-${p}-${n}-${a}">—</div><div class="dg-sub">Views gained today</div></div>
        <div class="dg-item"><div class="dg-label">Created</div><div class="dg-val" id="dcreated-${p}-${n}-${a}">—</div><div class="dg-sub" id="dcreated-sub-${p}-${n}-${a}"></div></div>

async function load(){
  const p=platform,ac=p==='fb'?'c-fb':'c-ig',flwCls=p==='fb'?'acc-flw':'acc-flw ig',linkCls=p==='fb'?'detail-link':'detail-link ig';
  let totalAccs=0,totalReels=0,active=0,totalFlw=0,totalDelta=0,deltaCnt=0,totalIssues=0;

  const results=await Promise.all(Object.keys(PHONES).map(async num=>{
    const n=parseInt(num);let s=null,ctrs=[];
    try{const r=await fetch(`${API}/status/${p}/${n}`,{signal:AbortSignal.timeout(5000)});if(r.ok)s=await r.json();}catch(e){}
    try{const r=await fetch(`${API}/crane/containers/${p}/${n}`,{signal:AbortSignal.timeout(5000)});if(r.ok){const d=await r.json();ctrs=(d.containers||[]).sort((a,b)=>a.num-b.num);}}catch(e){}
    return{n,s,ctrs};
  }));

  for(const{n,s,ctrs}of results){
    const run=s?.status==='running',err=s?.status==='error';
    if(run)active++;
    const reels=s?.reels_posted||0;totalReels+=reels;
    const ctrCount=ctrs.length;totalAccs+=ctrCount;
    const pct=s&&s.container&&s.total_containers?Math.min(100,Math.round(s.container/s.total_containers*100)):0;
    const accs=s?.accounts||{};
    const e=id=>document.getElementById(id);

    const card=e(`card-${p}-${n}`);
    if(card)card.className=`card${run?p==='fb'?' running-fb':' running-ig':err?' has-error':''}`;

    const pill=e(`pill-${p}-${n}`);
    if(pill){pill.className=`pill ${run?p==='fb'?'pill-run-fb':'pill-run-ig':err?'pill-err':'pill-idle'}`;pill.innerHTML=run?`<span class="dot ${p==='fb'?'dot-fb':'dot-ig'}"></span>Running`:'Idle';}

    if(e(`plabel-${p}-${n}`))e(`plabel-${p}-${n}`).textContent=run?`Container ${s?.container||0} / ${s?.total_containers||ctrCount||'—'}`:`${ctrCount} containers`;
    if(e(`ppct-${p}-${n}`))e(`ppct-${p}-${n}`).textContent=run?pct+'%':'';
    if(e(`pfill-${p}-${n}`))e(`pfill-${p}-${n}`).style.width=pct+'%';
    if(e(`ms-reels-${p}-${n}`))e(`ms-reels-${p}-${n}`).textContent=reels||'—';

    const ctrKey=ctrs.map(c=>c.name).join(',');
    const listEl=e(`acc-list-${p}-${n}`);
    if(listEl&&ctrKey!==_ctrCache[`${p}-${n}`]){listEl.innerHTML=buildAccRows(p,n,ctrs,ac,linkCls,flwCls);_ctrCache[`${p}-${n}`]=ctrKey;}
    if(e(`acc-count-${p}-${n}`))e(`acc-count-${p}-${n}`).textContent=ctrCount?`${ctrCount} total`:'0';
    if(e(`ms-accs-${p}-${n}`))e(`ms-accs-${p}-${n}`).textContent=ctrCount||'—';

    let phoneFlw=0,phoneDelta=0,phoneDeltaCnt=0;
    for(const c of ctrs){
      const a=c.name,acc=accs[a]||accs[parseInt(a)]||{};
      const flwNum=parseFollowers(acc.followers);
      phoneFlw+=flwNum;totalFlw+=flwNum;
      const d=acc.delta_24h;
      if(d!==null&&d!==undefined&&!isNaN(Number(d))){const dv=Number(d);phoneDelta+=dv;phoneDeltaCnt++;totalDelta+=dv;deltaCnt++;}
      const st=acc.status||'ok';
      if(st==='verify'||st==='logged_out'||st==='ban')totalIssues++;

      const row=e(`ar-${p}-${n}-${a}`);
      if(row){const isCur=String(s?.current_container)===String(a);row.className=`acc-row${isCur?p==='fb'?' acc-active':' acc-active-ig':''}${expanded[`${p}-${n}-${a}`]?' expanded':''}`;}
      if(e(`an-${p}-${n}-${a}`)&&acc.name&&acc.name!=='?')e(`an-${p}-${n}-${a}`).textContent=acc.name;
      if(e(`flw-${p}-${n}-${a}`))e(`flw-${p}-${n}-${a}`).textContent=flwNum>0?fmt(flwNum):'—';
      const delta=fmtDelta(d);const del=e(`delta-${p}-${n}-${a}`);
      if(del){del.textContent=delta.text;del.className=`acc-delta ${delta.cls}`;}
      const badge=e(`badge-${p}-${n}-${a}`);
      if(badge){const cls=st==='verify'?'b-verify':st==='logged_out'?'b-logout':st==='ban'?'b-ban':'';const txt=st==='verify'?'VERIFY':st==='logged_out'?'OUT':st==='ban'?'BAN':'';badge.innerHTML=cls?`<span class="${cls}">${txt}</span>`:'';}
      if(expanded[`${p}-${n}-${a}`])updateDetail(p,n,a,acc,s);
    }

    if(e(`ms-flw-${p}-${n}`))e(`ms-flw-${p}-${n}`).textContent=phoneFlw>0?fmt(phoneFlw):'—';
    const pDelta=fmtDelta(phoneDeltaCnt?phoneDelta:null);const pdEl=e(`ms-delta-${p}-${n}`);
    if(pdEl){pdEl.textContent=pDelta.text;pdEl.style.color=pDelta.cls==='pos'?'var(--green)':pDelta.cls==='neg'?'var(--red)':'var(--t3)';}
  }

  document.getElementById('h-accounts').textContent=totalAccs||'—';
  document.getElementById('h-active').textContent=active||'—';
  document.getElementById('h-reels').textContent=fmt(totalReels)||'—';
  document.getElementById('h-followers').textContent=totalFlw>0?fmt(totalFlw):'—';
  const hd=fmtDelta(deltaCnt?totalDelta:null);const hde=document.getElementById('h-delta');
  hde.textContent=hd.text;hde.style.color=hd.cls==='pos'?'var(--green)':hd.cls==='neg'?'var(--red)':'var(--t3)';
  document.getElementById('h-lu').textContent='↻ '+new Date().toLocaleTimeString('en',{hour12:false,hour:'2-digit',minute:'2-digit'});

  document.getElementById('s-accounts').textContent=totalAccs||'—';
  document.getElementById('s-active').textContent=active||'—';
  document.getElementById('s-active-sub').textContent='of '+Object.keys(PHONES).length+' phones';
  document.getElementById('s-reels').textContent=fmt(totalReels)||'—';
  document.getElementById('s-followers').textContent=totalFlw>0?fmtFull(totalFlw):'—';
  document.getElementById('s-followers-sub').textContent=totalFlw>0?'= '+fmt(totalFlw)+' followers':'across all accounts';
  const sd=fmtDelta(deltaCnt?totalDelta:null);const sde=document.getElementById('s-delta');
  sde.textContent=sd.text;sde.style.color=sd.cls==='pos'?'var(--green)':sd.cls==='neg'?'var(--red)':'var(--t3)';
  const si=document.getElementById('s-issues');if(si){si.textContent=totalIssues||'0';si.style.color=totalIssues?'var(--yellow)':'var(--green)';}
  if(document.getElementById('s-issues-sub'))document.getElementById('s-issues-sub').textContent=totalIssues?totalIssues+' accounts need attention':'All accounts OK';
}

function updateDetail(p,n,i,acc,s){
  const e=id=>document.getElementById(id);
  const flwNum=parseFollowers(acc.followers);
  if(e(`dflw-${p}-${n}-${i}`))e(`dflw-${p}-${n}-${i}`).textContent=flwNum>0?fmt(flwNum):'—';
  if(e(`dflw-sub-${p}-${n}-${i}`))e(`dflw-sub-${p}-${n}-${i}`).textContent=flwNum>0?fmtFull(flwNum)+' followers':'No data yet';
  const d=fmtDelta(acc.delta_24h);const del=e(`ddelta-${p}-${n}-${i}`);
  if(del){del.textContent=d.text;del.className=`dg-val ${d.cls==='pos'?'c-green':d.cls==='neg'?'c-red':''}`;}
  if(e(`ddelta-sub-${p}-${n}-${i}`))e(`ddelta-sub-${p}-${n}-${i}`).textContent=d.cls==='pos'?'Growing ↑':d.cls==='neg'?'Declining ↓':'No change';
  if(e(`dviews-${p}-${n}-${i}`))e(`dviews-${p}-${n}-${i}`).textContent=acc.views?fmt(acc.views):'—';
  const vd=fmtDelta(acc.views_delta_24h);const vde=e(`dviews-delta-${p}-${n}-${i}`);
  if(vde){vde.textContent=vd.text;vde.className=`dg-val ${vd.cls==='pos'?'c-green':vd.cls==='neg'?'c-red':''}`;}
  if(e(`dcreated-${p}-${n}-${i}`))e(`dcreated-${p}-${n}-${i}`).textContent=fmtDate(acc.created_at);
  if(e(`dcreated-sub-${p}-${n}-${i}`))e(`dcreated-sub-${p}-${n}-${i}`).textContent=fmtDateFull(acc.created_at);
  if(e(`dlast-${p}-${n}-${i}`))e(`dlast-${p}-${n}-${i}`).textContent=s?.last_update?fmtTime(s.last_update):'—';
  const linkEl=e(`dlink-${p}-${n}-${i}`);
  if(linkEl){if(acc.bio_link){linkEl.textContent=acc.bio_link;linkEl.href='https://'+acc.bio_link;}else if(BIO_LINKS[n]){linkEl.textContent=BIO_LINKS[n];linkEl.href='https://'+BIO_LINKS[n];}}
}

async function loadFollowerHistory(p,n,i){
  const el=document.getElementById(`dflw-hist-${p}-${n}-${i}`);if(!el)return;
  try{
    const r=await fetch(`${API}/followers_history/${p}/${n}/${i}`,{signal:AbortSignal.timeout(5000)});
    if(!r.ok){el.innerHTML='<div style="font-size:10px;color:var(--t3);padding:4px 0">No history yet</div>';return;}
    const d=await r.json(),hist=d.history||[];
    if(!hist.length){el.innerHTML='<div style="font-size:10px;color:var(--t3);padding:4px 0">No history yet — runs when script posts</div>';return;}
    const rows=[...hist].reverse().slice(0,14);
    let html='';
    for(let k=0;k<rows.length;k++){
      const row=rows[k],prev=rows[k+1],flw=parseInt(row.followers)||0;
      const chg=prev?(flw-(parseInt(prev.followers)||0)):null;
      const chgTxt=chg===null?'':chg>0?'+'+chg.toLocaleString():chg<0?chg.toLocaleString():'=';
      const chgCls=chg===null?'zero':chg>0?'pos':chg<0?'neg':'zero';
      const dt=new Date(row.date+'T12:00:00'),dateStr=dt.toLocaleDateString('en',{month:'short',day:'numeric'});
      html+=`<div class="fhr"><span class="fhr-date">${dateStr}</span><span class="fhr-val">${flw.toLocaleString()}</span><span class="fhr-chg ${chgCls}">${chgTxt}</span></div>`;
    }
    el.innerHTML=html;
  }catch(e){el.innerHTML='<div style="font-size:10px;color:var(--t3)">Could not load</div>';}
}

function toggleDetail(n,i){
  const p=platform,key=`${p}-${n}-${i}`;
  expanded[key]=!expanded[key];
  const row=document.getElementById(`ar-${p}-${n}-${i}`),det=document.getElementById(`det-${p}-${n}-${i}`);
  if(expanded[key]){row?.classList.add('expanded');det?.classList.add('open');loadFollowerHistory(p,n,i);}
  else{row?.classList.remove('expanded');det?.classList.remove('open');}
}

function ctrNum(name){const v=parseInt(name);if(!isNaN(v))return v;const m=name.match(/:(\d+)$/);return m?parseInt(m[1]):null;}

async function craneCmd(phone,action,name='',num=''){
  const body={phone:parseInt(phone),action,name,container_num:num,platform};
  const r=await fetch(API+'/crane/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json();
  if(!craneLogs[phone])craneLogs[phone]=[];
  craneLogs[phone].unshift({text:action+(num?' #'+num:'')+(name&&name.length<25?' '+name:''),id:d.id,status:'pending',t:new Date().toLocaleTimeString('en',{hour12:false})});
  if(craneLogs[phone].length>8)craneLogs[phone].pop();
  renderCraneLog(phone);pollCmd(phone,d.id);return d.id;
}

async function pollCmd(phone,id){
  for(let i=0;i<60;i++){
    await new Promise(r=>setTimeout(r,2000));
    try{
      const r=await fetch(API+'/crane/queue'),d=await r.json();
      const cmd=(d.commands||[]).find(c=>c.id===id);if(!cmd)continue;
      if(cmd.status==='done'||cmd.status==='error'){
        const en=craneLogs[phone]?.find(l=>l.id===id);
        if(en){en.status=cmd.status;en.result=(cmd.result||'').slice(0,100);}
        renderCraneLog(phone);if(cmd.status==='done')refreshContainers(phone);return;
      }
    }catch(e){}
  }
}

async function refreshContainers(phone){
  try{
    const[r1,r2]=await Promise.all([fetch(API+'/crane/containers/'+platform+'/'+phone),fetch(API+'/crane/state/'+platform+'/'+phone)]);
    const d1=await r1.json(),d2=await r2.json();
    craneCtrs[phone]=d1.containers||[];craneState[phone]=d2.state||{};
    if(!craneSelected[phone])craneSelected[phone]=new Set();
    // Persist to localStorage so containers survive page refresh
    try{localStorage.setItem('craneCtrs_'+platform+'_'+phone,JSON.stringify(craneCtrs[phone]));}catch(e){}
    try{localStorage.setItem('craneState_'+platform+'_'+phone,JSON.stringify(craneState[phone]));}catch(e){}
    renderCraneContainers(phone);updateCommand(phone);
  }catch(e){}
}

function loadCraneCache(){
  // Load persisted crane containers on page load
  for(const num of Object.keys(PHONES)){
    const n=parseInt(num);
    try{const c=localStorage.getItem('craneCtrs_'+platform+'_'+n);if(c)craneCtrs[n]=JSON.parse(c);}catch(e){}
    try{const s=localStorage.getItem('craneState_'+platform+'_'+n);if(s)craneState[n]=JSON.parse(s);}catch(e){}
  }
}

function renderCraneContainers(phone){
  const el=document.getElementById('crane-ctrs-'+phone);if(!el)return;
  const ctrs=craneCtrs[phone]||[],state=craneState[phone]||{},sel=craneSelected[phone]||new Set();
  if(!ctrs.length){el.innerHTML='<div class="empty">No containers found</div>';return;}
  el.innerHTML=ctrs.map(c=>{
    const fresh=state[c.name]?.status==='fresh';
    return`<div class="ctr-row${c.active?' ctr-active':''}${fresh?' ctr-fresh':''}">
      <input type="checkbox" class="ctr-cb" ${sel.has(c.name)?'checked':''} onchange="toggleSelect(${phone},'${c.name}',this.checked)">
      <span class="ctr-name">${c.name}</span>
      ${c.active?'<span class="ctr-badge ctr-active-b">ACTIVE</span>':''}
      ${fresh?'<span class="ctr-badge ctr-fresh-b">NEW ✓</span>':''}
      <div style="margin-left:auto;display:flex;gap:3px">
        <button class="cbtn cbtn-sw" onclick="craneSwitchTo(${phone},'${c.name}')">Switch</button>
        <button class="cbtn cbtn-wi" onclick="craneWipe(${phone},'${c.name}')">Wipe</button>
        <button class="cbtn cbtn-de" onclick="craneDel(${phone},'${c.name}')">Del</button>
      </div>
    </div>`;
  }).join('');
}

function renderCraneLog(phone){
  const el=document.getElementById('crane-log-'+phone);if(!el)return;
  el.innerHTML=(craneLogs[phone]||[]).map(l=>`<div class="crane-log-item ${l.status}">[${l.t}] ${l.text}${l.result?' → '+l.result:''}</div>`).join('')||'<div class="crane-log-item">No commands yet</div>';
}

function toggleSelect(phone,name,checked){
  if(!craneSelected[phone])craneSelected[phone]=new Set();
  checked?craneSelected[phone].add(name):craneSelected[phone].delete(name);
  const n=(craneSelected[phone]||new Set()).size;
  const el=document.getElementById('crane-selcount-'+phone);if(el)el.textContent=n?n+' selected':'';
  updateCommand(phone);
}
function selectAll(phone){craneSelected[phone]=new Set((craneCtrs[phone]||[]).map(c=>c.name));renderCraneContainers(phone);updateCommand(phone);const el=document.getElementById('crane-selcount-'+phone);if(el)el.textContent=(craneCtrs[phone]||[]).length+' selected';}
function selectNone(phone){craneSelected[phone]=new Set();renderCraneContainers(phone);updateCommand(phone);const el=document.getElementById('crane-selcount-'+phone);if(el)el.textContent='';}
function selectFresh(phone){const st=craneState[phone]||{};craneSelected[phone]=new Set(Object.entries(st).filter(([,v])=>v.status==='fresh').map(([k])=>k));renderCraneContainers(phone);const n=(craneSelected[phone]||new Set()).size;const el=document.getElementById('crane-selcount-'+phone);if(el)el.textContent=n?n+' selected':'';updateCommand(phone);}
function selectAllExcept(phone){
  const inp=document.getElementById('keep-input-'+phone);if(!inp||!inp.value.trim()){alert('Enter container numbers to KEEP first');return;}
  const keep=new Set(inp.value.split(',').map(x=>parseInt(x.trim())).filter(n=>!isNaN(n)));
  craneSelected[phone]=new Set((craneCtrs[phone]||[]).filter(c=>{const num=ctrNum(c.name);return num===null||!keep.has(num);}).map(c=>c.name));
  renderCraneContainers(phone);const n=(craneSelected[phone]||new Set()).size;const el=document.getElementById('crane-selcount-'+phone);if(el)el.textContent=n?n+' selected':'';updateCommand(phone);
}
function updateCommand(phone){
  const box=document.getElementById('crane-cmd-box-'+phone),inp=document.getElementById('crane-cmd-'+phone);if(!box||!inp)return;
  const sel=craneSelected[phone]||new Set(),state=craneState[phone]||{};
  const freshSel=[...sel].filter(n=>state[n]?.status==='fresh'),targets=freshSel.length?freshSel:[...sel];
  if(!targets.length){box.style.display='none';return;}
  const nums=targets.map(n=>ctrNum(n)).filter(Boolean).sort((a,b)=>a-b).join(',');
  const script=document.getElementById('crane-script-'+phone)?.value||'fb_reel_auto_v3.py';
  const link=document.getElementById('crane-link-'+phone)?.value||'0';
  const linkArg=link!=='0'?` --link ${link}`:'';
  inp.value=`python ${script} --phone ${phone} --only ${nums}${linkArg}`;
  box.style.display='block';
}
function copyCmd(phone){
  const el=document.getElementById('crane-cmd-'+phone);if(!el?.value)return;
  navigator.clipboard.writeText(el.value).catch(()=>{el.select();document.execCommand('copy');});
  const btn=document.getElementById('crane-copybtn-'+phone);if(btn){btn.textContent='✓ Copied!';setTimeout(()=>btn.textContent='Copy',2000);}
}
async function craneSendList(phone){await craneCmd(phone,'list');}
function craneSwitchTo(phone,name){if(confirm('Switch to '+name+'?'))craneCmd(phone,'switch','',name);}
function craneWipe(phone,name){if(confirm('Wipe '+name+'?'))craneCmd(phone,'wipe','',name);}
function craneDel(phone,name){if(confirm('DELETE '+name+'?'))craneCmd(phone,'delete','',name);}
async function deleteSelected(phone){
  const sel=craneSelected[phone]||new Set();if(!sel.size){alert('Select containers first');return;}
  if(!confirm(`Delete ${sel.size} container(s)?\n${[...sel].join(', ')}`))return;
  for(const name of sel){await craneCmd(phone,'delete','',name);await new Promise(r=>setTimeout(r,500));}
}
async function deleteAndCreate(phone){
  const sel=craneSelected[phone]||new Set();if(!sel.size){alert('Select containers first');return;}
  if(!confirm(`Delete ${sel.size} and create fresh?\n${[...sel].join(', ')}`))return;
  await craneCmd(phone,'delete_and_create',[...sel].join(','),'');
}
function toggleCrane(phone){
  craneOpen[phone]=!craneOpen[phone];const panel=document.getElementById('crane-panel-'+phone);
  if(craneOpen[phone]){
    panel?.classList.add('open');
    // Only send list command if we have no cached data yet
    if(craneCtrs[phone]&&craneCtrs[phone].length){
      renderCraneContainers(phone);
      updateCommand(phone);
    }else{
      refreshContainers(phone);
      craneSendList(phone);
    }
  }else{
    panel?.classList.remove('open');
  }
}
function openCreateModal(phone){modalPhone=phone;document.getElementById('modal-name').value='';document.getElementById('modal-create').classList.add('open');setTimeout(()=>document.getElementById('modal-name').focus(),100);}
function closeModal(){document.getElementById('modal-create').classList.remove('open');modalPhone=null;}
function modalConfirmCreate(){const n=document.getElementById('modal-name').value.trim();if(!n){alert('Enter a name');return;}closeModal();craneCmd(modalPhone,'create',n,'');}
document.getElementById('modal-create').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
document.getElementById('modal-name').addEventListener('keydown',e=>{if(e.key==='Enter')modalConfirmCreate();});
setInterval(load,15000);
loadCraneCache();
buildCards();
load();
</script>
