<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Farm Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#070810;--s1:#0c0d1a;--s2:#10111f;--s3:#141628;
  --b1:#1a1b2e;--b2:#232540;--b3:#2e3055;
  --t1:#eef0f8;--t2:#8b90b8;--t3:#4a4f72;
  --fb:#1877f2;--fb2:#4299ff;
  --ig:#c13584;--ig2:#e1306c;--ig3:#f77737;
  --green:#10b981;--yellow:#f59e0b;--red:#ef4444;--purple:#7c3aed;
  --radius:14px;--radius-sm:8px;
}
body{background:var(--bg);color:var(--t1);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 50% -10%,rgba(24,119,242,.06),transparent);pointer-events:none}

/* ── HEADER ── */
header{position:sticky;top:0;z-index:200;background:rgba(7,8,16,.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--b1);height:62px;display:flex;align-items:center;padding:0 24px;gap:20px}
.logo{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800;letter-spacing:-.3px;margin-right:8px}
.logo-mark{width:32px;height:32px;background:linear-gradient(135deg,var(--fb),var(--purple));border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 0 20px rgba(24,119,242,.3)}
.tabs{display:flex;gap:2px;background:var(--s1);border:1px solid var(--b1);border-radius:10px;padding:3px}
.tab{padding:5px 18px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .2s;color:var(--t3);background:transparent;display:flex;align-items:center;gap:6px}
.tab.active-fb{background:var(--fb);color:#fff;box-shadow:0 0 16px rgba(24,119,242,.4)}
.tab.active-ig{background:linear-gradient(135deg,var(--ig),var(--ig2));color:#fff;box-shadow:0 0 16px rgba(193,53,132,.4)}
.tab:not(.active-fb):not(.active-ig):hover{color:var(--t2);background:var(--s2)}
.hstats{display:flex;align-items:center;gap:6px;margin-left:auto}
.hstat{display:flex;flex-direction:column;align-items:center;padding:5px 14px;background:var(--s1);border:1px solid var(--b1);border-radius:9px;min-width:72px}
.hstat-v{font-size:17px;font-weight:800;line-height:1}
.hstat-l{font-size:9px;color:var(--t3);font-weight:500;text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
.hstat-v.fb-c{background:linear-gradient(135deg,var(--fb),var(--fb2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hstat-v.ig-c{background:linear-gradient(135deg,var(--ig2),var(--ig3));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sep{width:1px;height:32px;background:var(--b1)}
.hbtn{background:linear-gradient(135deg,var(--fb),var(--purple));color:#fff;border:none;padding:7px 16px;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .2s;box-shadow:0 0 16px rgba(24,119,242,.25)}
.hbtn:hover{opacity:.85}
.hbtn.ig-btn{background:linear-gradient(135deg,var(--ig),var(--ig2));box-shadow:0 0 16px rgba(193,53,132,.25)}

/* ── MAIN ── */
main{padding:20px 24px;max-width:1560px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}

/* ── CARD ── */
.card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--radius);overflow:hidden;transition:border-color .3s,transform .2s}
.card:hover{transform:translateY(-1px);border-color:var(--b2)}
.card.running-fb{border-color:rgba(24,119,242,.3)}
.card.running-ig{border-color:rgba(225,48,108,.3)}
.card.error{border-color:rgba(239,68,68,.25)}

.card-top{background:linear-gradient(180deg,var(--s2) 0%,var(--s1) 100%);border-bottom:1px solid var(--b1);padding:14px 16px}
.card-top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.phone-badge{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;flex-shrink:0}
.phone-badge.fb-badge{background:linear-gradient(135deg,rgba(24,119,242,.2),rgba(66,153,255,.1));border:1px solid rgba(24,119,242,.3);color:var(--fb2)}
.phone-badge.ig-badge{background:linear-gradient(135deg,rgba(193,53,132,.2),rgba(225,48,108,.1));border:1px solid rgba(193,53,132,.3);color:var(--ig2)}
.phone-info{margin-left:10px;flex:1}
.phone-title{font-size:14px;font-weight:700}
.phone-ip{font-size:10px;color:var(--t3);font-family:monospace;margin-top:1px}
.status-pill{display:flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600}
.pill-run-fb{background:rgba(24,119,242,.1);color:var(--fb2);border:1px solid rgba(24,119,242,.2)}
.pill-run-ig{background:rgba(225,48,108,.1);color:var(--ig2);border:1px solid rgba(225,48,108,.2)}
.pill-idle{background:rgba(74,79,114,.15);color:var(--t3);border:1px solid var(--b1)}
.pill-err{background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(239,68,68,.2)}
.dot{width:6px;height:6px;border-radius:50%;animation:pulse 1.8s infinite}
.dot-fb{background:var(--fb2)}.dot-ig{background:var(--ig2)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}

/* Progress */
.prog-row{display:flex;justify-content:space-between;margin-bottom:5px}
.prog-label{font-size:10px;color:var(--t3)}
.prog-pct{font-size:10px;font-weight:700;color:var(--t2)}
.prog-bar{height:3px;background:var(--b1);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width .8s ease}
.prog-fill-fb{background:linear-gradient(90deg,var(--fb),var(--fb2))}
.prog-fill-ig{background:linear-gradient(90deg,var(--ig),var(--ig2),var(--ig3))}

/* Stats mini row */
.mini-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.ms{background:var(--bg);border:1px solid var(--b1);border-radius:8px;padding:7px 4px;text-align:center}
.ms-v{font-size:16px;font-weight:800;line-height:1}
.ms-v.fb-c{background:linear-gradient(135deg,var(--fb),var(--fb2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ms-v.ig-c{background:linear-gradient(135deg,var(--ig2),var(--ig3));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ms-l{font-size:8px;color:var(--t3);text-transform:uppercase;letter-spacing:.7px;margin-top:2px;font-weight:500}

/* Account list */
.acc-list{max-height:220px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--b2) transparent}
.acc-list::-webkit-scrollbar{width:3px}
.acc-list::-webkit-scrollbar-track{background:transparent}
.acc-list::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}

.acc-section-head{padding:10px 16px 6px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--b1)}
.acc-section-title{font-size:9px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.8px}
.acc-section-count{font-size:9px;color:var(--t3);font-weight:600}

.acc-row{padding:6px 16px;display:flex;align-items:center;gap:8px;cursor:pointer;transition:background .15s;border-bottom:1px solid transparent}
.acc-row:hover{background:var(--s2)}
.acc-row.active-acc{background:rgba(24,119,242,.05)}
.acc-row.active-acc-ig{background:rgba(193,53,132,.05)}
.acc-num{width:22px;font-size:10px;color:var(--t3);font-weight:600;flex-shrink:0;text-align:right}
.acc-name{flex:1;font-size:11px;color:var(--t2);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-row.active-acc .acc-name,.acc-row.active-acc-ig .acc-name{font-weight:600;color:var(--t1)}
.acc-followers{font-size:11px;font-weight:700;color:var(--fb2);min-width:38px;text-align:right}
.acc-followers.ig-flw{color:var(--ig2)}
.acc-delta{font-size:10px;font-weight:700;min-width:38px;text-align:right}
.acc-delta.pos{color:var(--green)}
.acc-delta.neg{color:var(--red)}
.acc-delta.zero{color:var(--t3)}
.acc-badge{font-size:8px;padding:2px 6px;border-radius:20px;font-weight:700;text-transform:uppercase;flex-shrink:0}
.badge-ok{display:none}
.badge-verify{background:rgba(245,158,11,.12);color:#fbbf24;border:1px solid rgba(245,158,11,.25)}
.badge-logout{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.25)}
.badge-ban{background:rgba(100,116,139,.12);color:#94a3b8;border:1px solid rgba(100,116,139,.25)}
.acc-arrow{font-size:10px;color:var(--t3);transition:transform .2s;flex-shrink:0}
.acc-row.expanded .acc-arrow{transform:rotate(180deg)}

/* Expanded detail panel */
.acc-detail{display:none;background:var(--bg);border-bottom:1px solid var(--b1);padding:12px 16px 14px 46px}
.acc-detail.open{display:block}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dg-item{background:var(--s1);border:1px solid var(--b1);border-radius:8px;padding:9px 12px}
.dg-label{font-size:9px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px}
.dg-value{font-size:14px;font-weight:700;color:var(--t1)}
.dg-value.big{font-size:18px}
.dg-sub{font-size:10px;color:var(--t3);margin-top:2px}
.dg-value.green{color:var(--green)}
.dg-value.red{color:var(--red)}
.dg-value.muted{color:var(--t3);font-size:12px}
.detail-link{font-size:11px;color:var(--fb2);text-decoration:none;font-weight:500}
.detail-link.ig-link{color:var(--ig2)}
.detail-link:hover{text-decoration:underline}

/* Crane panel */
.crane-btn{font-size:10px;padding:4px 10px;background:rgba(124,58,237,.12);border:1px solid rgba(124,58,237,.25);color:#a78bfa;border-radius:7px;cursor:pointer;font-family:inherit;font-weight:600}
.crane-btn:hover{background:rgba(124,58,237,.22)}
.crane-panel{display:none;border-top:1px solid var(--b1)}
.crane-panel.open{display:block}
.ctr-row{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:8px;background:var(--s1);border:1px solid var(--b1)}
.ctr-row.ctr-active{border-color:rgba(16,185,129,.35);background:rgba(16,185,129,.05)}
.ctr-row.ctr-fresh{border-color:rgba(124,58,237,.35);background:rgba(124,58,237,.05)}
.ctr-name{font-size:11px;font-weight:600;color:var(--t2);font-family:monospace;flex:1}
.ctr-cb{width:14px;height:14px;cursor:pointer;accent-color:var(--purple)}
.ctr-badge{font-size:8px;padding:1px 6px;border-radius:20px;font-weight:700;text-transform:uppercase}
.ctr-badge-active{background:rgba(16,185,129,.12);color:#34d399;border:1px solid rgba(16,185,129,.25)}
.ctr-badge-fresh{background:rgba(124,58,237,.12);color:#a78bfa;border:1px solid rgba(124,58,237,.25)}
.cbtn{padding:3px 9px;font-size:10px;border-radius:6px;border:none;cursor:pointer;font-family:inherit;font-weight:600}
.cbtn-switch{background:rgba(59,130,246,.12);color:#60a5fa;border:1px solid rgba(59,130,246,.25)}
.cbtn-wipe{background:rgba(245,158,11,.12);color:#fbbf24;border:1px solid rgba(245,158,11,.25)}
.cbtn-del{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.25)}
.crane-log-item{font-size:10px;color:var(--t3);font-family:monospace}
.crane-log-item.done{color:#34d399}.crane-log-item.error{color:#f87171}.crane-log-item.pending{color:#fbbf24}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);z-index:999;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--s1);border:1px solid var(--b2);border-radius:16px;padding:24px;width:320px}
.modal-title{font-size:14px;font-weight:700;margin-bottom:14px}
.modal input{width:100%;background:var(--bg);border:1px solid var(--b2);border-radius:8px;padding:9px 12px;color:var(--t1);font-family:inherit;font-size:13px;margin-bottom:14px;outline:none}
.modal input:focus{border-color:var(--purple)}
.modal-btns{display:flex;gap:8px}
.modal-btns .btn{flex:1;padding:8px;font-size:12px;font-weight:600;border:none;border-radius:8px;cursor:pointer;font-family:inherit}
.btn-confirm{background:linear-gradient(135deg,var(--green),#059669);color:#fff}
.btn-cancel{background:var(--s2);color:var(--t2);border:1px solid var(--b2)}

/* Utilities */
.btn-sm{padding:5px 12px;font-size:11px;border-radius:8px;border:none;cursor:pointer;font-family:inherit;font-weight:600;color:#fff;transition:opacity .2s}
.btn-sm:hover{opacity:.85}
.btn-blue{background:linear-gradient(135deg,#1d4ed8,var(--fb))}
.btn-green{background:linear-gradient(135deg,#059669,var(--green))}
.btn-red{background:linear-gradient(135deg,#b91c1c,var(--red))}
.btn-purple{background:linear-gradient(135deg,#5b21b6,var(--purple))}
.btn-ghost{background:var(--s2);color:var(--t2);border:1px solid var(--b2)}
.tag{display:inline-block;font-size:9px;padding:2px 7px;border-radius:20px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.tag-fb{background:rgba(24,119,242,.1);color:var(--fb2);border:1px solid rgba(24,119,242,.2)}
.tag-ig{background:rgba(225,48,108,.1);color:var(--ig2);border:1px solid rgba(225,48,108,.2)}
</style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-mark">⬡</div>Farm</div>
  <div class="tabs">
    <button class="tab active-fb" id="tab-fb" onclick="switchPlatform('fb')">
      <span>🟦</span> Facebook
    </button>
    <button class="tab" id="tab-ig" onclick="switchPlatform('ig')">
      <span>📸</span> Instagram
    </button>
  </div>
  <div class="hstats">
    <div class="hstat"><div class="hstat-v" id="h-accounts" style="background:linear-gradient(135deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent">137</div><div class="hstat-l">Accounts</div></div>
    <div class="sep"></div>
    <div class="hstat"><div class="hstat-v" id="h-active">—</div><div class="hstat-l">Active</div></div>
    <div class="sep"></div>
    <div class="hstat"><div class="hstat-v" id="h-reels">—</div><div class="hstat-l">Reels</div></div>
    <div class="sep"></div>
    <div class="hstat"><div class="hstat-v" id="h-followers">—</div><div class="hstat-l">Followers</div></div>
    <div class="sep"></div>
    <div class="hstat"><div class="hstat-v" id="h-delta" style="color:var(--green)">—</div><div class="hstat-l">+24h</div></div>
    <div class="sep"></div>
    <button class="hbtn" id="refresh-btn" onclick="load()">↻ Refresh</button>
  </div>
</header>

<main><div class="grid" id="grid"></div></main>

<div class="modal-overlay" id="modal-create">
  <div class="modal">
    <div class="modal-title">➕ Create Container</div>
    <input id="modal-name" placeholder="Name (e.g. 11)"/>
    <div class="modal-btns">
      <button class="btn btn-confirm" onclick="modalConfirmCreate()">Create</button>
      <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
const API = 'https://farm-production-8282.up.railway.app';
const PHONES = {
  1:{ip:'192.168.1.9', fb:10, ig:10},
  2:{ip:'192.168.1.12',fb:30, ig:30},
  3:{ip:'192.168.1.14',fb:20, ig:20},
  4:{ip:'192.168.1.10',fb:20, ig:20},
  5:{ip:'192.168.1.11',fb:19, ig:19},
  6:{ip:'192.168.1.15',fb:20, ig:20},
  7:{ip:'192.168.1.13',fb:18, ig:18},
  8:{ip:'192.168.1.5', fb:20, ig:20},
};

let platform = 'fb';
const expanded = {};  // "phone-acc" -> bool
const craneOpen={}, craneCtrs={}, craneLogs={}, craneState={}, craneSelected={};
let modalPhone=null;

// ── FORMATTERS ────────────────────────────────────────────────────────────────
function fmt(n){
  if(n===null||n===undefined||n==='?'||n==='—'||n==='')return'—';
  const s=String(n).trim().replace(/,/g,'');
  const su=s.toUpperCase();
  let v;
  // Handle already-formatted strings like "1.5K", "6K", "2.3M"
  if(su.endsWith('K'))      v=parseFloat(su)*1000;
  else if(su.endsWith('M')) v=parseFloat(su)*1000000;
  else                      v=parseFloat(s);
  if(isNaN(v))return'—';
  if(v>=1000000)return(v/1000000).toFixed(1)+'M';
  if(v>=1000)   return(v/1000).toFixed(1)+'K';
  return Math.round(v).toString();
}

function fmtDelta(d){
  if(d===null||d===undefined)return{text:'—',cls:'zero'};
  if(d>0)return{text:'+'+fmt(d),cls:'pos'};
  if(d<0)return{text:fmt(d),cls:'neg'};
  return{text:'→0',cls:'zero'};
}

function fmtDate(ts){
  if(!ts)return'—';
  const d=new Date(ts*1000);
  const now=new Date();
  const diff=Math.floor((now-d)/86400000);
  if(diff===0)return'Today';
  if(diff===1)return'Yesterday';
  if(diff<30)return diff+'d ago';
  return d.toLocaleDateString('en',{month:'short',day:'numeric'});
}

function fmtDateFull(ts){
  if(!ts)return'—';
  return new Date(ts*1000).toLocaleDateString('en',{month:'short',day:'numeric',year:'numeric'});
}

function fmtLastUpdate(str){
  if(!str)return'—';
  return str.slice(11,16); // HH:MM from "2026-08-12 14:32:00"
}

// ── PLATFORM SWITCH ───────────────────────────────────────────────────────────
function switchPlatform(p){
  platform=p;
  document.getElementById('tab-fb').className='tab'+(p==='fb'?' active-fb':'');
  document.getElementById('tab-ig').className='tab'+(p==='ig'?' active-ig':'');
  const btn=document.getElementById('refresh-btn');
  btn.className='hbtn'+(p==='ig'?' ig-btn':'');
  buildCards();
  load();
}

// ── BUILD CARDS ONCE ──────────────────────────────────────────────────────────
function buildCards(){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  const p=platform;
  const ac=p==='fb'?'fb-c':'ig-c';
  const pfill=p==='fb'?'prog-fill-fb':'prog-fill-ig';
  const pbadge=p==='fb'?'phone-badge fb-badge':'phone-badge ig-badge';
  const flwCls=p==='fb'?'acc-followers':'acc-followers ig-flw';
  const linkCls=p==='fb'?'detail-link':'detail-link ig-link';

  for(const[num,cfg]of Object.entries(PHONES)){
    const n=parseInt(num);
    const accCount=cfg[p];
    const card=document.createElement('div');
    card.className='card'; card.id=`card-${p}-${n}`;

    // Build account rows
    const rows=Array.from({length:accCount},(_,i)=>{
      const a=i+1;
      return`
      <div class="acc-row" id="ar-${p}-${n}-${a}" onclick="toggleDetail(${n},${a})">
        <span class="acc-num">${a}</span>
        <span class="acc-name" id="an-${p}-${n}-${a}">Account ${a}</span>
        <span id="badge-${p}-${n}-${a}"></span>
        <span class="${flwCls}" id="flw-${p}-${n}-${a}">—</span>
        <span class="acc-delta zero" id="delta-${p}-${n}-${a}">—</span>
        <span class="acc-arrow">▾</span>
      </div>
      <div class="acc-detail" id="det-${p}-${n}-${a}">
        <div class="detail-grid">
          <div class="dg-item">
            <div class="dg-label">Followers</div>
            <div class="dg-value big ${ac}" id="dflw-${p}-${n}-${a}">—</div>
            <div class="dg-sub" id="dflw-sub-${p}-${n}-${a}">—</div>
          </div>
          <div class="dg-item">
            <div class="dg-label">+24h Change</div>
            <div class="dg-value" id="ddelta-${p}-${n}-${a}">—</div>
            <div class="dg-sub" id="ddelta-sub-${p}-${n}-${a}"></div>
          </div>
          <div class="dg-item">
            <div class="dg-label">Views</div>
            <div class="dg-value muted" id="dviews-${p}-${n}-${a}">—</div>
            <div class="dg-sub">Total reel views</div>
          </div>
          <div class="dg-item">
            <div class="dg-label">Reels Posted</div>
            <div class="dg-value" id="dreels-${p}-${n}-${a}">—</div>
            <div class="dg-sub" id="dreels-sub-${p}-${n}-${a}"></div>
          </div>
          <div class="dg-item">
            <div class="dg-label">Created</div>
            <div class="dg-value" id="dcreated-${p}-${n}-${a}">—</div>

// ── UPDATE IN-PLACE ───────────────────────────────────────────────────────────
async function load(){
  const p=platform;
  let totalReels=0, active=0, totalFlw=0, totalDelta=0, deltaCnt=0;

  for(const[num,cfg]of Object.entries(PHONES)){
    const n=parseInt(num);
    let s=null;
    try{const r=await fetch(`${API}/status/${p}/${n}`,{signal:AbortSignal.timeout(4000)});s=await r.json();}catch(e){}

    const run=s?.status==='running', err=s?.status==='error';
    if(run)active++;
    if(s)totalReels+=s.reels_posted||0;
    const accCount=cfg[p];
    const pct=s?Math.min(100,Math.round(s.container/(s.total_containers||accCount)*100)):0;
    const accs=s?.accounts||{};

    // Card class
    const card=document.getElementById(`card-${p}-${n}`);
    if(card) card.className=`card${run?p==='fb'?' running-fb':' running-ig':err?' error':''}`;

    // Pill
    const pill=document.getElementById(`pill-${p}-${n}`);
    if(pill){
      pill.className=`status-pill ${run?p==='fb'?'pill-run-fb':'pill-run-ig':err?'pill-err':'pill-idle'}`;
      pill.innerHTML=run?`<span class="dot ${p==='fb'?'dot-fb':'dot-ig'}"></span>${p==='fb'?'FB ':'IG '}Running`:err?'Error':'Idle';
    }

    // Progress
    const e=id=>document.getElementById(id);
    if(e(`plabel-${p}-${n}`)) e(`plabel-${p}-${n}`).textContent=`Container ${s?.container||0} / ${s?.total_containers||accCount}`;
    if(e(`ppct-${p}-${n}`))   e(`ppct-${p}-${n}`).textContent=pct+'%';
    if(e(`pfill-${p}-${n}`))  e(`pfill-${p}-${n}`).style.width=pct+'%';

    // Per-phone stats
    let phoneFlw=0, phoneDelta=0, phoneDeltaCnt=0;
    for(let i=1;i<=accCount;i++){
      const acc=accs[String(i)]||accs[i]||{};
      const flwNum=parseFollowers(acc.followers);
      phoneFlw+=flwNum;
      totalFlw+=flwNum;
      const d=acc.delta_24h;
      if(d!==null&&d!==undefined){phoneDelta+=d;phoneDeltaCnt++;totalDelta+=d;deltaCnt++;}

      // Row update
      const row=e(`ar-${p}-${n}-${i}`);
      if(row){
        const isCur=s?.current_container===i;
        row.className=`acc-row${isCur?p==='fb'?' active-acc':' active-acc-ig':''}${expanded[`${p}-${n}-${i}`]?' expanded':''}`;
      }
      if(e(`an-${p}-${n}-${i}`)&&acc.name&&acc.name!=='?') e(`an-${p}-${n}-${i}`).textContent=acc.name;
      if(e(`flw-${p}-${n}-${i}`)) e(`flw-${p}-${n}-${i}`).textContent=fmt(acc.followers);

      // Delta badge in row
      const delta=fmtDelta(acc.delta_24h);
      if(e(`delta-${p}-${n}-${i}`)){
        const el=e(`delta-${p}-${n}-${i}`);
        el.textContent=delta.text; el.className=`acc-delta ${delta.cls}`;
      }

      // Status badge
      const st=acc.status||'ok';
      if(e(`badge-${p}-${n}-${i}`)){
        const cls=st==='verify'?'acc-badge badge-verify':st==='logged_out'?'acc-badge badge-logout':st==='ban'?'acc-badge badge-ban':'';
        const txt=st==='verify'?'VERIFY':st==='logged_out'?'OUT':st==='ban'?'BAN':'';
        e(`badge-${p}-${n}-${i}`).innerHTML=cls?`<span class="${cls}">${txt}</span>`:'';
      }

      // Expanded detail panel
      if(expanded[`${p}-${n}-${i}`]){
        updateDetail(p,n,i,acc,s);
      }
    }

    if(e(`ms-reels-${p}-${n}`)) e(`ms-reels-${p}-${n}`).textContent=s?.reels_posted??'—';
    if(e(`ms-flw-${p}-${n}`))   e(`ms-flw-${p}-${n}`).textContent=fmt(phoneFlw)||'—';
    if(e(`ms-delta-${p}-${n}`)){ const d=fmtDelta(phoneDeltaCnt?phoneDelta:null); e(`ms-delta-${p}-${n}`).textContent=d.text; e(`ms-delta-${p}-${n}`).style.color=d.cls==='pos'?'var(--green)':d.cls==='neg'?'var(--red)':'var(--t3)'; }
  }

  // Header stats
  document.getElementById('h-active').textContent=active||'—';
  document.getElementById('h-reels').textContent=fmt(totalReels)||'—';
  document.getElementById('h-followers').textContent=fmt(totalFlw)||'—';
  const hd=fmtDelta(deltaCnt?totalDelta:null);
  const hde=document.getElementById('h-delta');
  hde.textContent=hd.text;
  hde.style.color=hd.cls==='pos'?'var(--green)':hd.cls==='neg'?'var(--red)':'var(--t3)';
}

function parseFollowers(raw){
  if(!raw||raw==='?'||raw==='—')return 0;
  const su=String(raw).trim().replace(/,/g,'').toUpperCase();
  if(su.endsWith('K'))return parseFloat(su)*1000;
  if(su.endsWith('M'))return parseFloat(su)*1000000;
  return parseFloat(su)||0;
}

function updateDetail(p,n,i,acc,s){
  const e=id=>document.getElementById(id);
  if(e(`dflw-${p}-${n}-${i}`)) e(`dflw-${p}-${n}-${i}`).textContent=fmt(acc.followers)||'—';
  if(e(`dflw-sub-${p}-${n}-${i}`)) e(`dflw-sub-${p}-${n}-${i}`).textContent=acc.followers&&acc.followers!='?'?acc.followers+' followers':'';
  const d=fmtDelta(acc.delta_24h);
  if(e(`ddelta-${p}-${n}-${i}`)){ const el=e(`ddelta-${p}-${n}-${i}`);el.textContent=d.text;el.className=`dg-value ${d.cls==='pos'?'green':d.cls==='neg'?'red':''}`; }
  if(e(`ddelta-sub-${p}-${n}-${i}`)) e(`ddelta-sub-${p}-${n}-${i}`).textContent=d.cls==='pos'?'Growing ↑':d.cls==='neg'?'Declining ↓':'No change';
  if(e(`dreels-${p}-${n}-${i}`)) e(`dreels-${p}-${n}-${i}`).textContent=acc.reels_posted??'—';
  if(e(`dreels-sub-${p}-${n}-${i}`)) e(`dreels-sub-${p}-${n}-${i}`).textContent=s?.current_container===i?'Currently active':'';
  if(e(`dviews-${p}-${n}-${i}`)) e(`dviews-${p}-${n}-${i}`).textContent=acc.views?fmt(acc.views):'—';
  if(e(`dcreated-${p}-${n}-${i}`)){e(`dcreated-${p}-${n}-${i}`).textContent=fmtDate(acc.created_at);}
  if(e(`dcreated-sub-${p}-${n}-${i}`)){e(`dcreated-sub-${p}-${n}-${i}`).textContent=fmtDateFull(acc.created_at);}
  if(e(`dlast-${p}-${n}-${i}`)){e(`dlast-${p}-${n}-${i}`).textContent=s?.last_update?fmtLastUpdate(s.last_update):'—';}
  if(e(`dlink-${p}-${n}-${i}`)&&acc.bio_link){const a=e(`dlink-${p}-${n}-${i}`);a.textContent=acc.bio_link;a.href='https://'+acc.bio_link;}
}

function toggleDetail(n,i){
  const key=`${platform}-${n}-${i}`;
  expanded[key]=!expanded[key];
  const row=document.getElementById(`ar-${platform}-${n}-${i}`);
  const det=document.getElementById(`det-${platform}-${n}-${i}`);
  if(expanded[key]){row?.classList.add('expanded');det?.classList.add('open');}
  else{row?.classList.remove('expanded');det?.classList.remove('open');}
}

// ── CRANE ─────────────────────────────────────────────────────────────────────
function ctrNum(name){const n=parseInt(name);if(!isNaN(n))return n;const m=name.match(/:(\d+)$/);return m?parseInt(m[1]):null;}

async function craneCmd(phone,action,name='',num=''){
  const body={phone:parseInt(phone),action,name,container_num:num};
  const r=await fetch(API+'/crane/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json();
  if(!craneLogs[phone])craneLogs[phone]=[];
  craneLogs[phone].unshift({text:action+(num?' #'+num:'')+(name&&name.length<30?' '+name:''),id:d.id,status:'pending',t:new Date().toLocaleTimeString('en',{hour12:false})});
  if(craneLogs[phone].length>8)craneLogs[phone].pop();
  renderCraneLog(phone);
  pollCmd(phone,d.id);
  return d.id;
}

async function pollCmd(phone,id){
  for(let i=0;i<60;i++){
    await new Promise(r=>setTimeout(r,2000));
    try{
      const r=await fetch(API+'/crane/queue');
      const d=await r.json();
      const cmd=(d.commands||[]).find(c=>c.id===id);
      if(!cmd)continue;
      if(cmd.status==='done'||cmd.status==='error'){
        const en=craneLogs[phone]?.find(l=>l.id===id);
        if(en){en.status=cmd.status;en.result=(cmd.result||'').slice(0,40);}
        renderCraneLog(phone);
        if(cmd.status==='done')refreshContainers(phone);
        return;
      }
    }catch(e){}
  }
}

async function refreshContainers(phone){
  try{
    const[r1,r2]=await Promise.all([fetch(API+'/crane/containers/'+phone),fetch(API+'/crane/state/'+phone)]);
    const d1=await r1.json();const d2=await r2.json();
    craneCtrs[phone]=d1.containers||[];craneState[phone]=d2.state||{};
    if(!craneSelected[phone])craneSelected[phone]=new Set();
    renderCraneContainers(phone);updateCommand(phone);
  }catch(e){}
}

function renderCraneContainers(phone){
  const el=document.getElementById('crane-ctrs-'+phone);
  if(!el)return;
  const ctrs=craneCtrs[phone]||[];
  const state=craneState[phone]||{};
  const sel=craneSelected[phone]||new Set();
  if(!ctrs.length){el.innerHTML='<div style="font-size:11px;color:var(--t3);text-align:center;padding:10px">No containers found</div>';return;}
  el.innerHTML=ctrs.map(c=>{
    const fresh=state[c.name]?.status==='fresh';
    return`<div class="ctr-row${c.active?' ctr-active':''}${fresh?' ctr-fresh':''}">
      <input type="checkbox" class="ctr-cb" ${sel.has(c.name)?'checked':''} onchange="toggleSelect(${phone},'${c.name}',this.checked)">
      <span class="ctr-name">${c.name}</span>
      ${c.active?'<span class="ctr-badge ctr-badge-active">ACTIVE</span>':''}
      ${fresh?'<span class="ctr-badge ctr-badge-fresh">NEW ✓</span>':''}
      <div style="margin-left:auto;display:flex;gap:4px">
        <button class="cbtn cbtn-switch" onclick="craneSwitchTo(${phone},'${c.name}')">Switch</button>
        <button class="cbtn cbtn-wipe"   onclick="craneWipe(${phone},'${c.name}')">Wipe</button>
        <button class="cbtn cbtn-del"    onclick="craneDel(${phone},'${c.name}')">Del</button>
      </div>
    </div>`;
  }).join('');
}

function renderCraneLog(phone){
  const el=document.getElementById('crane-log-'+phone);
  if(!el)return;
  el.innerHTML=(craneLogs[phone]||[]).map(l=>`<div class="crane-log-item ${l.status}">[${l.t}] ${l.text}${l.result?' → '+l.result:''}</div>`).join('')||'<div class="crane-log-item">No commands yet</div>';
}

function toggleSelect(phone,name,checked){
  if(!craneSelected[phone])craneSelected[phone]=new Set();
  checked?craneSelected[phone].add(name):craneSelected[phone].delete(name);
  const n=(craneSelected[phone]||new Set()).size;
  const el=document.getElementById('crane-selcount-'+phone);
  if(el)el.textContent=n?n+' selected':'';
  updateCommand(phone);
}

function selectAll(phone){craneSelected[phone]=new Set((craneCtrs[phone]||[]).map(c=>c.name));renderCraneContainers(phone);updateCommand(phone);const el=document.getElementById('crane-selcount-'+phone);if(el)el.textContent=(craneCtrs[phone]||[]).length+' selected';}
function selectNone(phone){craneSelected[phone]=new Set();renderCraneContainers(phone);updateCommand(phone);const el=document.getElementById('crane-selcount-'+phone);if(el)el.textContent='';}
function selectFresh(phone){const st=craneState[phone]||{};craneSelected[phone]=new Set(Object.entries(st).filter(([,v])=>v.status==='fresh').map(([k])=>k));renderCraneContainers(phone);const n=(craneSelected[phone]||new Set()).size;const el=document.getElementById('crane-selcount-'+phone);if(el)el.textContent=n?n+' selected':'';updateCommand(phone);}
function selectAllExcept(phone){
  // Parse keep numbers from input
  const inp=document.getElementById('keep-input-'+phone);
  if(!inp||!inp.value.trim()){alert('Type container numbers to KEEP first (e.g. 3,4,8,15,19)');return;}
  const keepNums=new Set(inp.value.split(',').map(x=>parseInt(x.trim())).filter(n=>!isNaN(n)));
  const ctrs=craneCtrs[phone]||[];
  // Select all containers whose number is NOT in keepNums
  craneSelected[phone]=new Set(ctrs.filter(c=>{
    const num=ctrNum(c.name);
    return num===null||!keepNums.has(num);
  }).map(c=>c.name));
  renderCraneContainers(phone);
  const n=(craneSelected[phone]||new Set()).size;
  const el=document.getElementById('crane-selcount-'+phone);
  if(el)el.textContent=n?n+' selected':'';
  updateCommand(phone);
}

function updateCommand(phone){
  const box=document.getElementById('crane-cmd-box-'+phone);
  const inp=document.getElementById('crane-cmd-'+phone);
  if(!box||!inp)return;
  const sel=craneSelected[phone]||new Set();
  const state=craneState[phone]||{};
  const freshSel=[...sel].filter(n=>state[n]?.status==='fresh');
  const targets=freshSel.length?freshSel:[...sel];
  if(!targets.length){box.style.display='none';return;}
  const nums=targets.map(n=>ctrNum(n)).filter(Boolean).sort((a,b)=>a-b).join(',');
  const script=document.getElementById('crane-script-'+phone)?.value||'fb_reel_auto_v3.py';
  const link=document.getElementById('crane-link-'+phone)?.value||'0';
  inp.value=`python ${script} --phone ${phone} --only ${nums} --link ${link}`;
  box.style.display='block';
}

function copyCmd(phone){
  const el=document.getElementById('crane-cmd-'+phone);
  if(!el?.value)return;
  navigator.clipboard.writeText(el.value).catch(()=>{el.select();document.execCommand('copy');});
  const btn=document.getElementById('crane-copybtn-'+phone);
  if(btn){btn.textContent='✓ Copied!';setTimeout(()=>btn.textContent='Copy',2000);}
}

async function craneSendList(phone){await craneCmd(phone,'list');}
function craneSwitchTo(phone,name){if(confirm('Switch to '+name+'?'))craneCmd(phone,'switch','',name);}
function craneWipe(phone,name){if(confirm('Wipe '+name+'?'))craneCmd(phone,'wipe','',name);}
function craneDel(phone,name){if(confirm('DELETE '+name+'?'))craneCmd(phone,'delete','',name);}

async function deleteSelected(phone){
  const sel=craneSelected[phone]||new Set();
  if(!sel.size){alert('Select containers first');return;}
  if(!confirm(`Delete ${sel.size} container(s)?\n${[...sel].join(', ')}`))return;
  for(const name of sel){await craneCmd(phone,'delete','',name);await new Promise(r=>setTimeout(r,500));}
}

async function deleteAndCreate(phone){
  const sel=craneSelected[phone]||new Set();
  if(!sel.size){alert('Select containers first');return;}
  if(!confirm(`Delete ${sel.size} and create fresh?\n${[...sel].join(', ')}`))return;
  await craneCmd(phone,'delete_and_create',[...sel].join(','),'');
}

function toggleCrane(phone){
  craneOpen[phone]=!craneOpen[phone];
  const panel=document.getElementById('crane-panel-'+phone);
  if(craneOpen[phone]){
    panel?.classList.add('open');
    refreshContainers(phone);  // show cached instantly
    craneSendList(phone);       // also trigger fresh SSH list from phone
  } else {
    panel?.classList.remove('open');
  }
}

function openCreateModal(phone){modalPhone=phone;document.getElementById('modal-name').value='';document.getElementById('modal-create').classList.add('open');setTimeout(()=>document.getElementById('modal-name').focus(),100);}
function closeModal(){document.getElementById('modal-create').classList.remove('open');modalPhone=null;}
function modalConfirmCreate(){const n=document.getElementById('modal-name').value.trim();if(!n){alert('Enter a name');return;}closeModal();craneCmd(modalPhone,'create',n,'');}

document.getElementById('modal-create').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
document.getElementById('modal-name').addEventListener('keydown',e=>{if(e.key==='Enter')modalConfirmCreate();});

// Auto-refresh every 15s silently
setInterval(load,15000);
buildCards();
load();
</script>
