<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Farm Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--paper:#fff;--ink:#172033;--muted:#667085;--faint:#98a2b3;--line:#e6e9f0;--fb:#1877f2;--ig:#d62976;--green:#12b76a;--amber:#f79009;--red:#f04438;--violet:#6938ef;--shadow:0 8px 24px rgba(16,24,40,.06);--r:14px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px Manrope,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1600px;margin:auto;padding:0 24px 40px}.top{height:72px;display:flex;align-items:center;gap:22px;border-bottom:1px solid var(--line)}.brand{font-weight:800;font-size:17px;letter-spacing:-.5px;display:flex;gap:9px;align-items:center}.brand-mark{width:31px;height:31px;background:linear-gradient(145deg,#3d8bfd,#6638e5);border-radius:9px;color:#fff;display:grid;place-items:center;font-size:17px;box-shadow:0 5px 12px #1877f23b}.platforms{display:flex;background:#edf0f5;padding:3px;border-radius:9px;gap:2px}.platforms button,.phone-chip{border:0;background:transparent;border-radius:7px;padding:7px 12px;color:var(--muted);font-size:12px;font-weight:700}.platforms button.active.fb{background:#fff;color:var(--fb);box-shadow:0 1px 3px #10182819}.platforms button.active.ig{background:#fff;color:var(--ig);box-shadow:0 1px 3px #10182819}.connection{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}.signal{width:8px;height:8px;border-radius:50%;background:var(--amber)}.signal.ok{background:var(--green);box-shadow:0 0 0 4px #12b76a20}.refresh{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-weight:700;color:#344054}.refresh:hover{border-color:#bfc7d5}.hero{padding:26px 0 20px;display:flex;align-items:end;justify-content:space-between;gap:18px}.eyebrow{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:1.1px;text-transform:uppercase}.hero h1{font-size:25px;letter-spacing:-1px;margin:4px 0 0}.updated{font-size:11px;color:var(--muted);white-space:nowrap}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:24px}.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-height:92px;box-shadow:var(--shadow)}.kpi label{font-size:10px;text-transform:uppercase;letter-spacing:.75px;font-weight:800;color:var(--muted)}.kpi strong{font-size:23px;line-height:1.25;display:block;margin-top:4px;letter-spacing:-.8px}.kpi small{font-size:10px;color:var(--faint)}.good{color:var(--green)}.accent{color:var(--fb)}.toolbar{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);margin-bottom:16px}.phone-nav{display:flex;gap:4px;overflow:auto;scrollbar-width:none;flex:1}.phone-chip{white-space:nowrap;border:1px solid transparent}.phone-chip.active{background:#f0f5ff;color:var(--fb);border-color:#d8e6ff}.phone-chip.ig-active{background:#fff0f7;color:var(--ig);border-color:#ffe0ee}.search{border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:210px;outline:none;color:var(--ink)}.search:focus{border-color:#98bafc;box-shadow:0 0 0 3px #1877f21a}.select{border:1px solid var(--line);border-radius:8px;background:#fff;color:#475467;padding:8px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(385px,1fr));gap:16px}.phone-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}.phone-card.error{border-color:#fecdca}.card-head{padding:16px;border-bottom:1px solid var(--line)}.head-row{display:flex;align-items:center;gap:11px}.phone-id{height:38px;width:38px;display:grid;place-items:center;border-radius:11px;font-weight:800;font-size:14px;color:#fff;background:var(--fb)}.ig .phone-id{background:linear-gradient(135deg,#f58529,#d62976,#7b3dae)}.phone-name{font-size:14px;font-weight:800}.ip{font:10px 'DM Mono',monospace;color:var(--faint);margin-top:2px}.status{margin-left:auto;font-size:10px;font-weight:800;border-radius:99px;padding:5px 8px;background:#f2f4f7;color:#667085}.status.running{background:#ecfdf3;color:#027a48}.status.error{background:#fef3f2;color:#b42318}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;background:currentColor}.progress-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin:16px 0 6px}.progress{height:5px;background:#edf0f5;border-radius:99px;overflow:hidden}.progress i{height:100%;display:block;background:var(--fb);border-radius:inherit}.ig .progress i{background:linear-gradient(90deg,#d62976,#f58529)}.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px}.stat{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}.stat b{display:block;font-size:14px}.stat span{font-size:9px;text-transform:uppercase;letter-spacing:.55px;color:var(--faint);font-weight:800}.card-actions{display:flex;gap:7px;padding:10px 16px;background:#fafbfc;border-bottom:1px solid var(--line)}.btn{padding:7px 9px;border-radius:7px;border:1px solid var(--line);background:#fff;color:#475467;font-size:10px;font-weight:800}.btn:hover{background:#f9fafb}.btn.primary{background:#f0f5ff;color:var(--fb);border-color:#d8e6ff}.ig .btn.primary{background:#fff0f7;color:var(--ig);border-color:#ffe0ee}.table-wrap{max-height:330px;overflow:auto}.table{width:100%;border-collapse:collapse}.table th{position:sticky;top:0;background:#fff;text-align:left;padding:10px 16px;font-size:9px;letter-spacing:.75px;text-transform:uppercase;color:var(--faint);z-index:1}.table td{padding:10px 16px;border-top:1px solid #f1f3f7;font-size:11px;vertical-align:middle}.table tr{cursor:pointer}.table tbody tr:hover{background:#fafcff}.container{font:11px 'DM Mono',monospace;font-weight:500}.name{max-width:125px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#475467}.number{text-align:right;font-weight:700}.delta.pos{color:#027a48}.delta.neg{color:#b42318}.missing{color:#98a2b3;font-weight:500}.badge{border-radius:99px;padding:3px 6px;font-size:9px;font-weight:800}.badge.verify{color:#b54708;background:#fffaeb}.badge.logged_out,.badge.ban{color:#b42318;background:#fef3f2}.drawer{display:none;border-top:1px solid var(--line);padding:14px 16px;background:#fcfcfd}.drawer.open{display:block}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.detail{border:1px solid var(--line);padding:8px;border-radius:8px}.detail label{display:block;color:var(--faint);font-size:9px;text-transform:uppercase;letter-spacing:.5px;font-weight:800}.detail b{display:block;margin-top:3px;font-size:12px}.history{grid-column:1/-1}.history-row{display:flex;gap:16px;padding:4px 0;border-bottom:1px solid #f0f2f6;font:10px 'DM Mono',monospace}.history-row:last-child{border:0}.history-row span:last-child{margin-left:auto}.crane{display:none;padding:14px 16px;background:#fcfcff;border-top:1px solid var(--line)}.crane.open{display:block}.crane-title{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;margin-bottom:9px}.crane-title small{font-weight:500;color:var(--muted)}.crane-actions{display:flex;gap:6px;flex-wrap:wrap}.btn.danger{color:#b42318;background:#fff;border-color:#fecdca}.btn.violet{color:#5925dc;background:#f4f3ff;border-color:#e9d7fe}.roster{margin-top:10px;border:1px solid var(--line);border-radius:8px;max-height:170px;overflow:auto}.roster-row{display:flex;align-items:center;gap:8px;padding:7px 9px;border-bottom:1px solid #f1f3f7;font:11px 'DM Mono',monospace}.roster-row:last-child{border:0}.roster-row button{margin-left:auto}.notice{font-size:10px;color:var(--muted);padding:9px 0}.empty{padding:30px 16px;text-align:center;color:var(--muted);font-size:11px}.toast{position:fixed;right:20px;bottom:20px;padding:10px 14px;background:#172033;color:#fff;border-radius:9px;font-size:11px;font-weight:700;box-shadow:0 12px 30px #10182833;opacity:0;pointer-events:none;transform:translateY(8px);transition:.2s}.toast.show{opacity:1;transform:none}.modal{position:fixed;inset:0;background:#10182866;display:none;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.dialog{background:#fff;border-radius:14px;width:340px;padding:20px;box-shadow:0 18px 40px #10182833}.dialog h2{font-size:16px;margin:0 0 5px}.dialog p{font-size:11px;color:var(--muted);margin:0 0 14px}.dialog input{width:100%;border:1px solid var(--line);padding:10px;border-radius:8px;outline:none}.dialog-foot{display:flex;gap:8px;justify-content:end;margin-top:12px}@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.app{padding:0 14px 30px}.top{height:auto;padding:14px 0;flex-wrap:wrap;gap:10px}.connection{margin-left:0}.hero{padding:20px 0 15px}.hero h1{font-size:21px}.kpis{grid-template-columns:repeat(2,1fr);gap:8px}.kpi{min-height:78px;padding:11px}.toolbar{flex-wrap:wrap}.search{width:100%}.grid{grid-template-columns:1fr}.detail-grid{grid-template-columns:repeat(2,1fr)}.history{grid-column:1/-1}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand"><span class="brand-mark">⌁</span>Farm Operations</div><div class="platforms"><button id="fbTab" class="active fb" onclick="switchPlatform('fb')">Facebook</button><button id="igTab" onclick="switchPlatform('ig')">Instagram</button></div><div class="connection"><span id="signal" class="signal"></span><span id="connectionText">Connecting…</span></div><button class="refresh" onclick="load(true)">↻ Refresh</button></header>
<section class="hero"><div><div class="eyebrow">Live operations</div><h1 id="title">Facebook overview</h1></div><div class="updated" id="updated">Waiting for data…</div></section>
<section class="kpis"><div class="kpi"><label>Crane containers</label><strong id="kContainers">—</strong><small>authoritative roster</small></div><div class="kpi"><label>Phones running</label><strong id="kRunning">—</strong><small id="kRunningSub">monitoring automation</small></div><div class="kpi"><label>Reels posted</label><strong id="kReels">—</strong><small>reported by phones</small></div><div class="kpi"><label>Total followers</label><strong id="kFollowers" class="accent">—</strong><small>known container stats</small></div><div class="kpi"><label>24h growth</label><strong id="kDelta" class="good">—</strong><small>where reported</small></div><div class="kpi"><label>Needs attention</label><strong id="kIssues">—</strong><small id="kIssuesSub">status checks</small></div></section>
<section class="toolbar"><div class="phone-nav" id="phoneNav"></div><input id="search" class="search" type="search" placeholder="Search container or account" oninput="applyFilters()"><select id="sort" class="select" onchange="applyFilters()"><option value="container">Sort: container</option><option value="followers">Sort: followers</option><option value="growth">Sort: 24h growth</option></select></section>
<main class="grid" id="grid"></main></div>
<div class="modal" id="modal"><div class="dialog"><h2>Create container</h2><p id="modalText">Crane will assign the next available container number.</p><div class="dialog-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="confirmCreate()">Create next</button></div></div></div><div class="toast" id="toast"></div>
<script>
const API='https://farm-production-8282.up.railway.app';
const PHONES={1:{ip:'192.168.1.9'},2:{ip:'192.168.1.12'},3:{ip:'192.168.1.14'},4:{ip:'192.168.1.10'},5:{ip:'192.168.1.11'},6:{ip:'192.168.1.15'},7:{ip:'192.168.1.13'},8:{ip:'192.168.1.5'},9:{ip:'192.168.1.20'}};
let platform='fb',phoneFilter='all',modalPhone=null,model={},refreshTimer;
const $=id=>document.getElementById(id),safe=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function num(v){if(v===null||v===undefined||v===''||v==='?'||v==='—')return null;const s=String(v).replace(/,/g,'').toUpperCase();const n=parseFloat(s);return Number.isFinite(n)?n*(s.endsWith('M')?1e6:s.endsWith('K')?1e3:1):null}
function fmt(v){v=num(v);if(v===null)return'—';return v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e4?Math.round(v/1e3)+'K':v>=1e3?(v/1e3).toFixed(1)+'K':Math.round(v).toLocaleString()}
function delta(v){v=num(v);return v===null?'<span class="missing">—</span>':`<span class="delta ${v>0?'pos':v<0?'neg':''}">${v>0?'+':''}${fmt(v)}</span>`}
function rosterKey(p,n){return`farm-roster-${p}-${n}`}function normalizeRoster(a){const seen=new Set;return(Array.isArray(a)?a:[]).map(x=>({name:String(x?.name??'').trim(),num:Number(x?.num??x?.name),uuid:String(x?.uuid??''),active:!!x?.active})).filter(x=>/^\d+$/.test(x.name)&&!seen.has(x.name)&&seen.add(x.name)).sort((a,b)=>a.num-b.num)}
async function json(url,opt){const r=await fetch(url,{...opt,signal:AbortSignal.timeout(6500)});if(!r.ok)throw Error(r.status);return r.json()}
async function getRoster(p,n){try{const d=await json(`${API}/crane/containers/${p}/${n}`);const r=normalizeRoster(d.containers);localStorage.setItem(rosterKey(p,n),JSON.stringify(r));return{roster:r,online:true}}catch(e){try{return{roster:normalizeRoster(JSON.parse(localStorage.getItem(rosterKey(p,n))||'[]')),online:false}}catch{return{roster:[],online:false}}}}
function accountFor(accounts,c){if(accounts?.[c.name])return accounts[c.name];if(accounts?.[String(c.num)])return accounts[String(c.num)];return Object.values(accounts||{}).find(a=>String(a?.container)===String(c.num))||{}}
function buildNav(){ $('phoneNav').innerHTML=`<button class="phone-chip ${phoneFilter==='all'?'active '+(platform==='ig'?'ig-active':''):''}" onclick="setPhone('all')">All phones</button>`+Object.keys(PHONES).map(n=>`<button class="phone-chip ${phoneFilter==n?'active '+(platform==='ig'?'ig-active':''):''}" onclick="setPhone(${n})">Phone ${n}</button>`).join('') }
function setPhone(n){phoneFilter=String(n);buildNav();render()}
function switchPlatform(p){platform=p;$('fbTab').className=p==='fb'?'active fb':'';$('igTab').className=p==='ig'?'active ig':'';$('title').textContent=(p==='fb'?'Facebook':'Instagram')+' overview';phoneFilter='all';buildNav();load(true)}
async function load(manual=false){if(manual)$('updated').textContent='Refreshing…';const all=await Promise.all(Object.keys(PHONES).map(async key=>{const n=Number(key);const [roster,status]=await Promise.all([getRoster(platform,n),json(`${API}/status/${platform}/${n}`).catch(()=>null)]);return[n,{...roster,status}]}));model=Object.fromEntries(all);const online=all.some(([,v])=>v.online);$('signal').className='signal '+(online?'ok':'');$('connectionText').textContent=online?'Live connection':'Offline cache';$('updated').textContent='Updated '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});render();clearTimeout(refreshTimer);refreshTimer=setTimeout(load,15000)}
function visibleRows(info){const term=$('search').value.trim().toLowerCase(),sort=$('sort').value;let rows=info.roster.map(c=>({c,a:accountFor(info.status?.accounts,c)})).filter(x=>!term||x.c.name.includes(term)||String(x.a.name||'').toLowerCase().includes(term));rows.sort((x,y)=>sort==='followers'?(num(y.a.followers)||-1)-(num(x.a.followers)||-1):sort==='growth'?(num(y.a.delta_24h)||-Infinity)-(num(x.a.delta_24h)||-Infinity):x.c.num-y.c.num);return rows}
function render(){let totalContainers=0,running=0,reels=0,followers=0,hasFollowers=false,growth=0,hasGrowth=false,issues=0;const cards=[];for(const [n,info] of Object.entries(model)){const s=info.status||{},rows=visibleRows(info);totalContainers+=info.roster.length;if(s.status==='running')running++;reels+=Number(s.reels_posted)||0;for(const c of info.roster){const a=accountFor(s.accounts,c),f=num(a.followers),d=num(a.delta_24h);if(f!==null){followers+=f;hasFollowers=true}if(d!==null){growth+=d;hasGrowth=true}if(['verify','logged_out','ban'].includes(a.status))issues++}if(phoneFilter!=='all'&&phoneFilter!==n)continue;cards.push(card(n,info,rows))}$('kContainers').textContent=totalContainers||'—';$('kRunning').textContent=running||'0';$('kRunningSub').textContent=`of ${Object.keys(PHONES).length} phones reporting`; $('kReels').textContent=fmt(reels);$('kFollowers').textContent=hasFollowers?fmt(followers):'—';$('kDelta').textContent=hasGrowth?(growth>0?'+':'')+fmt(growth):'—';$('kDelta').className=growth<0?'':'good';$('kIssues').textContent=issues;$('kIssues').style.color=issues?'var(--amber)':'var(--green)';$('kIssuesSub').textContent=issues?`${issues} account${issues===1?'':'s'} flagged`:'All reported accounts clear';$('grid').innerHTML=cards.join('')||'<div class="empty">No phones match this filter.</div>'}
function card(n,info,rows){const s=info.status||{},isIG=platform==='ig',run=s.status==='running',err=s.status==='error',count=info.roster.length,current=Number(s.current_container)||0,pct=count?Math.min(100,Math.round(current/count*100)):0;let phoneFollowers=0,phoneDelta=0,hasD=false;for(const {a} of rows){phoneFollowers+=num(a.followers)||0;const d=num(a.delta_24h);if(d!==null){phoneDelta+=d;hasD=true}}const status=err?'error':run?'running':'';const statusText=err?'Error':run?'Running':'Idle';return `<article class="phone-card ${isIG?'ig':''} ${err?'error':''}" id="phone-${n}"><header class="card-head"><div class="head-row"><div class="phone-id">${n}</div><div><div class="phone-name">Phone ${n}</div><div class="ip">${PHONES[n].ip}</div></div><span class="status ${status}">${run?'<i class="dot"></i>':''}${statusText}</span></div><div class="progress-meta"><span>${run?`Container ${current||'—'} of ${count||'—'}`:`${count} Crane container${count===1?'':'s'}`}</span><span>${run&&count?pct+'%':''}</span></div><div class="progress"><i style="width:${run?pct:0}%"></i></div><div class="stat-row"><div class="stat"><b>${count||'—'}</b><span>Containers</span></div><div class="stat"><b>${fmt(s.reels_posted)||'—'}</b><span>Reels</span></div><div class="stat"><b>${phoneFollowers?fmt(phoneFollowers):'—'}</b><span>Followers</span></div><div class="stat"><b class="${phoneDelta<0?'delta neg':'good'}">${hasD?(phoneDelta>0?'+':'')+fmt(phoneDelta):'—'}</b><span>24h growth</span></div></div></header><div class="card-actions"><button class="btn primary" onclick="toggleCrane(${n})">⚙ Crane controls</button><button class="btn" onclick="refreshPhone(${n})">Refresh roster</button><span class="notice">${info.online?'Server roster':'Cached roster'}</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Container</th><th>Account</th><th class="number">Followers</th><th class="number">24h</th></tr></thead><tbody>${rows.length?rows.map(({c,a})=>row(n,c,a)).join(''):`<tr><td colspan="4" class="empty">No containers in the authoritative Crane roster.</td></tr>`}</tbody></table></div><section class="crane" id="crane-${n}"><div class="crane-title">Crane controls <small>Commands are queued for Phone ${n}; roster stays authoritative.</small></div><div class="crane-actions"><button class="btn primary" onclick="sendCmd(${n},'list')">↻ Get list</button><button class="btn" onclick="openCreate(${n})">+ Create</button><button class="btn danger" onclick="selectedCmd(${n},'delete')">Delete selected</button><button class="btn violet" onclick="selectedCmd(${n},'delete_and_create')">Delete & recreate</button></div><div class="roster">${info.roster.length?info.roster.map(c=>`<div class="roster-row"><input type="checkbox" data-crane="${n}" value="${safe(c.name)}"><span>#${safe(c.name)}</span>${c.active?'<span class="badge verify">ACTIVE</span>':''}<button class="btn" onclick="sendCmd(${n},'switch','${safe(c.name)}','${safe(c.num)}')">Switch</button><button class="btn" onclick="sendCmd(${n},'wipe','${safe(c.name)}','${safe(c.num)}')">Wipe</button><button class="btn danger" onclick="sendCmd(${n},'delete','${safe(c.name)}','${safe(c.num)}')">Delete</button></div>`).join(''):'<div class="empty">No saved roster. Use “Get list” to ask the phone agent.</div>'}</div></section></article>`}
function row(n,c,a){const id=`d-${platform}-${n}-${c.name}`,st=a.status||'',badge=['verify','logged_out','ban'].includes(st)?`<span class="badge ${st}">${st==='logged_out'?'OUT':st.toUpperCase()}</span>`:'';return `<tr onclick="toggleDetail('${id}',${n},'${safe(c.name)}')"><td class="container">#${safe(c.name)} ${badge}</td><td class="name">${a.name&&a.name!=='?'?safe(a.name):'<span class="missing">No stats yet</span>'}</td><td class="number">${fmt(a.followers)}</td><td class="number">${delta(a.delta_24h)}</td></tr><tr><td colspan="4" class="drawer" id="${id}"><div class="detail-grid"><div class="detail"><label>Followers</label><b>${fmt(a.followers)}</b></div><div class="detail"><label>Total views</label><b>${fmt(a.views)}</b></div><div class="detail"><label>Views / 24h</label><b>${delta(a.views_delta_24h)}</b></div><div class="detail"><label>Created</label><b>${a.created_at?new Date(a.created_at*1000).toLocaleDateString():'—'}</b></div><div class="detail"><label>Last report</label><b>${a.last_update||'—'}</b></div><div class="detail"><label>Status</label><b>${safe(st||'No status')}</b></div><div class="detail history" id="hist-${id}"><label>Follower history</label><b class="missing">Open to load</b></div></div></td></tr>`}
function toggleDetail(id,n,c){const el=$(id);el.classList.toggle('open');if(el.classList.contains('open'))loadHistory(id,n,c)}
async function loadHistory(id,n,c){const out=$('hist-'+id);try{const d=await json(`${API}/followers_history/${platform}/${n}/${c}`),h=(d.history||[]).slice(-8).reverse();out.innerHTML='<label>Follower history</label>'+(h.length?h.map(x=>`<div class="history-row"><span>${safe(x.date)}</span><span>${fmt(x.followers)}</span></div>`).join(''):'<b class="missing">No history reported yet</b>')}catch{out.innerHTML='<label>Follower history</label><b class="missing">Could not load history</b>'}}
function toggleCrane(n){$('crane-'+n).classList.toggle('open')}function openCreate(n){modalPhone=n;$('modalText').textContent=`Create the next available ${platform.toUpperCase()} container on Phone ${n}.`; $('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open');modalPhone=null}function confirmCreate(){const n=modalPhone;closeModal();sendCmd(n,'create')}
async function sendCmd(phone,action,name='',container_num=''){try{const d=await json(API+'/crane/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:Number(phone),platform,action,name,container_num})});toast(`Command queued: ${action}${name?' #'+name:''}`);if(action==='list'||action==='create'||action==='delete'||action==='delete_and_create'||action==='wipe')pollCommand(phone,d.id)}catch{toast('Could not queue command. Check connection.') }}
function selectedCmd(n,action){const selected=[...document.querySelectorAll(`[data-crane="${n}"]:checked`)];if(!selected.length)return toast('Select one or more containers first.');if(!confirm(`${action==='delete'?'Delete':'Delete and recreate'} ${selected.length} selected container(s)?`))return;selected.forEach(x=>sendCmd(n,action,x.value,x.value))}
async function pollCommand(n,id){for(let tries=0;tries<30;tries++){await new Promise(r=>setTimeout(r,2000));try{const d=await json(API+'/crane/queue'),cmd=(d.commands||[]).find(x=>x.id===id);if(cmd&&cmd.status!=='pending'){toast(cmd.status==='done'?'Command completed':'Command returned an error');refreshPhone(n);return}}catch{}}}
async function refreshPhone(n){const r=await getRoster(platform,n);if(model[n])model[n].roster=r.roster,model[n].online=r.online;render();toast(`Phone ${n} roster refreshed`)}function applyFilters(){render()}function toast(text){const t=$('toast');t.textContent=text;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),2600)}
buildNav();load();
</script></body></html>
